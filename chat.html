<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Урал</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17212b">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--chat-bg, #0e1621); color: var(--text, #fff); }
  :root {
    --accent: #2aabee;
    --chat-bg: #0e1621;
    --header-bg: #17212b;
    --input-bg: #242f3d;
    --self-msg: #2b5278;
    --other-msg: #182533;
    --text: #fff;
    --text-secondary: #7d8b99;
    --radius: 12px;
    --border: rgba(0,0,0,0.3);
  }
  :root.light {
    --chat-bg: #f0f2f5;
    --header-bg: #ffffff;
    --input-bg: #f5f6f8;
    --self-msg: #2aabee;
    --other-msg: #ffffff;
    --text: #1a1a1a;
    --text-secondary: #65676b;
    --border: rgba(0,0,0,0.08);
  }
  #app { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: var(--chat-bg); display: flex; flex-direction: column; overflow: hidden; }
  @media (min-width: 481px) { #app { top: 20px; bottom: 20px; border-radius: 12px; } }

  /* Шапка */
  #header { padding: 8px 12px; background: var(--header-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; z-index: 2; }
  #header .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 17px; color: #fff; font-weight: 600; flex-shrink: 0; overflow: hidden; cursor: pointer; }
  #header .avatar img { width: 100%; height: 100%; object-fit: cover; }
  #header .info { flex: 1; min-width: 0; }
  #header .info .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #header .info .status { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
  #header .info .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #2ecc71; }
  #header .icon-btn { background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; padding: 6px; border-radius: 50%; flex-shrink: 0; }
  #header .icon-btn:hover { background: rgba(128,128,128,0.15); color: var(--text); }

  /* Поиск */
  #search-bar { display: none; padding: 6px 12px; background: var(--header-bg); border-bottom: 1px solid var(--border); gap: 8px; align-items: center; }
  #search-bar.active { display: flex; }
  #search-input { flex: 1; padding: 8px 14px; border: none; border-radius: 18px; background: var(--input-bg); color: var(--text); font-size: 14px; outline: none; }
  #search-input::placeholder { color: var(--text-secondary); }
  #search-close { background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; padding: 4px 8px; }

  /* Закреплённое */
  #pinned-bar { display: none; padding: 6px 12px; background: var(--header-bg); border-bottom: 1px solid var(--border); gap: 8px; align-items: center; font-size: 12px; color: var(--text-secondary); }
  #pinned-bar.active { display: flex; }
  #pinned-bar .pin-icon { color: var(--accent); font-size: 14px; }
  #pinned-bar .pin-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pinned-bar button { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 14px; }

  /* Онлайн */
  #online-strip { padding: 4px 12px; display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0; background: var(--header-bg); border-bottom: 1px solid var(--border); }
  #online-strip:empty { display: none; }
  .online-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; background: rgba(128,128,128,0.15); color: var(--text-secondary); padding: 2px 8px 2px 2px; border-radius: 12px; flex-shrink: 0; }
  .online-badge .dot-avatar { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; font-weight: 600; overflow: hidden; }
  .online-badge .dot-avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* Сообщения */
  #messages { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--chat-bg); scroll-behavior: smooth; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 4px; }
  .msg-wrap { display: flex; flex-direction: column; flex-shrink: 0; max-width: 80%; animation: msgIn 0.2s ease; position: relative; }
  .msg-wrap.self { align-self: flex-end; align-items: flex-end; }
  .msg-wrap.other { align-self: flex-start; align-items: flex-start; }
  .msg-wrap.hidden { display: none; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg { padding: 6px 10px 8px; border-radius: var(--radius); font-size: 14px; line-height: 1.35; word-break: break-word; position: relative; max-width: 100%; }
  .msg.self { background: var(--self-msg); color: #fff; border-bottom-right-radius: 4px; }
  .msg.other { background: var(--other-msg); color: var(--text); border-bottom-left-radius: 4px; }
  .msg .name { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; cursor: pointer; }
  .msg .name:hover { text-decoration: underline; }
  .msg .time { font-size: 10px; color: rgba(128,128,128,0.9); float: right; margin-left: 8px; margin-top: 4px; }
  .msg.self .time { color: rgba(255,255,255,0.6); }
  .msg img.attach { max-width: 100%; height: auto; border-radius: 8px; margin-top: 4px; display: block; cursor: pointer; }
  .msg img.sticker { width: 120px; height: 120px; display: block; margin: 2px 0; }
  .msg audio { width: 100%; margin-top: 4px; }
  .msg .reply-quote { background: rgba(0,0,0,0.15); border-left: 3px solid var(--accent); padding: 3px 8px; margin-bottom: 4px; border-radius: 4px; font-size: 12px; opacity: 0.85; }
  .msg .pinned-mark { color: var(--accent); font-size: 10px; margin-right: 4px; }
  .msg mark { background: rgba(255,235,59,0.4); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* Контекстное меню */
  .ctx { display: none; position: absolute; top: 0; right: 0; background: var(--header-bg); border-radius: 10px; padding: 4px; gap: 2px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); z-index: 20; border: 1px solid var(--border); }
  .ctx.show { display: flex; }
  .ctx button { background: none; border: none; color: var(--text-secondary); font-size: 15px; cursor: pointer; padding: 6px 8px; border-radius: 6px; }
  .ctx button:hover { background: rgba(128,128,128,0.15); color: var(--text); }

  /* Реакции */
  .reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .reaction-badge { font-size: 11px; background: rgba(128,128,128,0.15); color: var(--text); padding: 2px 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
  .reaction-badge.mine { background: rgba(42,171,238,0.15); color: var(--accent); border-color: rgba(42,171,238,0.3); }

  /* Ввод */
  #input-area { padding: 6px 8px; background: var(--header-bg); border-top: 1px solid var(--border); display: flex; gap: 4px; align-items: flex-end; flex-shrink: 0; padding-bottom: max(6px, env(safe-area-inset-bottom)); z-index: 2; }
  #attach, #voice-btn, #sticker-btn, #call-btn { width: 38px; height: 38px; border: none; border-radius: 50%; background: transparent; color: var(--text-secondary); font-size: 19px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  #attach:hover, #voice-btn:hover, #sticker-btn:hover, #call-btn:hover { background: rgba(128,128,128,0.15); }
  #attach:disabled, #voice-btn:disabled { opacity: 0.4; }
  #voice-btn.recording { color: #e74c3c; animation: pulse-rec 1s infinite; }
  @keyframes pulse-rec { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  #input { flex: 1; padding: 10px 14px; border: none; border-radius: 20px; background: var(--input-bg); color: var(--text); font-size: 15px; outline: none; min-width: 0; }
  #input::placeholder { color: var(--text-secondary); }
  #send { width: 38px; height: 38px; border: none; border-radius: 50%; background: transparent; color: var(--accent); font-size: 20px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  #send:disabled { color: var(--text-secondary); opacity: 0.4; }

  #reply-bar { display: none; padding: 4px 12px; background: var(--header-bg); border-top: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); align-items: center; gap: 8px; }
  #reply-bar.active { display: flex; }
  #reply-bar .text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #reply-bar button { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 16px; }

  #recording-bar { display: none; padding: 6px 12px; background: var(--header-bg); border-top: 1px solid var(--border); font-size: 12px; color: #e74c3c; align-items: center; gap: 8px; }
  #recording-bar.active { display: flex; }
  #recording-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #e74c3c; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  /* Стикеры */
  #sticker-panel { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: var(--header-bg); border-radius: 16px 16px 0 0; padding: 16px; display: none; z-index: 105; max-height: 50vh; overflow-y: auto; box-shadow: 0 -4px 20px rgba(0,0,0,0.3); }
  #sticker-panel.active { display: block; }
  #sticker-panel h3 { font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; }
  #sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  #sticker-grid .sticker-item { width: 100%; aspect-ratio: 1; cursor: pointer; transition: transform 0.15s; }
  #sticker-grid .sticker-item:hover { transform: scale(1.1); }
  #sticker-grid .sticker-item svg { width: 100%; height: 100%; }

  /* Drawer */
  #drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 100; }
  #drawer-overlay.active { display: block; }
  #drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; max-width: 85vw; background: var(--header-bg); z-index: 101; display: flex; flex-direction: column; transform: translateX(-100%); transition: transform 0.25s ease; box-shadow: 4px 0 20px rgba(0,0,0,0.3); }
  #drawer.open { transform: translateX(0); }
  #drawer-header { padding: 14px; border-bottom: 1px solid var(--border); }
  #drawer-header h2 { font-size: 17px; font-weight: 600; color: var(--accent); margin-bottom: 10px; }
  #add-contact-row { display: flex; gap: 6px; }
  #add-contact-row input { flex: 1; padding: 8px 12px; border: none; border-radius: 8px; background: var(--input-bg); color: var(--text); font-size: 13px; outline: none; }
  #add-contact-row button { padding: 8px 12px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  #contacts-list { flex: 1; overflow-y: auto; padding: 6px; }
  .contact-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; }
  .contact-item:hover { background: rgba(128,128,128,0.15); }
  .contact-item .c-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #fff; flex-shrink: 0; overflow: hidden; }
  .contact-item .c-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .contact-item .c-name { flex: 1; font-size: 14px; color: var(--text); }
  .contact-item .c-del { background: none; border: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; padding: 4px; }
  #drawer-footer { padding: 10px 14px; border-top: 1px solid var(--border); }
  #drawer-footer button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--input-bg); color: var(--text-secondary); font-size: 13px; cursor: pointer; }

  /* Аватарка */
  #avatar-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 110; }
  #avatar-panel.active { display: flex; }
  #avatar-inner { background: var(--header-bg); border-radius: 16px; padding: 20px; width: 90%; max-width: 320px; text-align: center; color: var(--text); }
  #avatar-inner h3 { margin-bottom: 14px; font-size: 17px; }
  #avatar-preview { width: 110px; height: 110px; border-radius: 50%; background: var(--accent); margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 44px; color: #fff; font-weight: 600; overflow: hidden; }
  #avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  #avatar-inner input[type=file] { display: none; }
  #avatar-inner label { display: inline-block; padding: 10px 20px; border-radius: 10px; background: var(--input-bg); color: var(--text); font-size: 14px; cursor: pointer; margin-bottom: 8px; }
  #avatar-close { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--input-bg); color: var(--text-secondary); font-size: 14px; cursor: pointer; margin-top: 6px; }

  /* Профиль */
  #profile-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 112; }
  #profile-panel.active { display: flex; }
  #profile-inner { background: var(--header-bg); border-radius: 16px; padding: 24px; width: 90%; max-width: 320px; text-align: center; color: var(--text); }
  #profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--accent); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff; font-weight: 600; overflow: hidden; }
  #profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
  #profile-name-big { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  #profile-status { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
  #profile-close { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--input-bg); color: var(--text-secondary); font-size: 14px; cursor: pointer; }
</style>
</head>

<div id="sticker-panel">

</div>

<div id="drawer-overlay"></div>
<div id="drawer">
  <div id="drawer-header">
    <h2>Урал</h2>

  </div>
  <div id="contacts-list"></div>
  <div id="drawer-footer"><button id="drawer-close">Закрыть</button></div>
</div>

<div id="avatar-panel">

    <div id="avatar-preview">?</div>
    <input type="file" id="avatar-file" accept="image/*">
    <label for="avatar-file">Выбрать фото</label>
    <button id="avatar-close">Закрыть</button>
  </div>
</div>

<div id="profile-panel">
  <div id="profile-inner">
    <div id="profile-avatar">?</div>
    <div id="profile-name-big">—</div>
    <div id="profile-status">Пользователь Урал</div>
    <button id="profile-close">Закрыть</button>
  </div>
</div>

  // ---- Push ----
  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
  }
  document.getElementById('notify-btn').onclick = async () => {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { statusEl.textContent = 'Не поддерживается'; return; }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { statusEl.textContent = 'Запрещено'; return; }
    try {
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      const json = sub.toJSON();
      await supabase.from('push_subscriptions').upsert({ user_name: myName, endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth }, { onConflict: 'endpoint' });
      statusEl.textContent = '🔔 Включены';
    } catch (e) { statusEl.textContent = 'Ошибка: ' + e.message; }
  };

  // ---- Drawer ----
  document.getElementById('contacts-btn').onclick = () => { drawer.classList.add('open'); drawerOverlay.classList.add('active'); renderContacts(); };
  document.getElementById('drawer-close').onclick = () => { drawer.classList.remove('open'); drawerOverlay.classList.remove('active'); };
  drawerOverlay.onclick = () => { drawer.classList.remove('open'); drawerOverlay.classList.remove('active'); };

  // ---- Контакты ----
  function getContacts() { return JSON.parse(localStorage.getItem('chat_contacts') || '[]'); }
  function saveContacts(list) { localStorage.setItem('chat_contacts', JSON.stringify(list)); }
  async function renderContacts() {
    const list = document.getElementById('contacts-list');
    const contacts = getContacts();
    if (contacts.length === 0) { list.innerHTML = '<p style="color:var(--text-secondary);font-size:13px;padding:16px;text-align:center;">Нет контактов</p>'; return; }
    list.innerHTML = '';
    const { data } = await supabase.from('profiles').select('user_name, avatar_url').in('user_name', contacts);
    const map = {}; (data || []).forEach(p => map[p.user_name] = p.avatar_url);
    contacts.forEach(name => {
      const div = document.createElement('div');
      div.className = 'contact-item';
      div.innerHTML = `<div class="c-avatar"></div><div class="c-name">${escapeHtml(name)}</div><button class="c-del">✕</button>`;
      setAvatar(div.querySelector('.c-avatar'), name, map[name]);
      div.onclick = (e) => {
        if (e.target.classList.contains('c-del')) { saveContacts(contacts.filter(c => c !== name)); renderContacts(); return; }
        localStorage.setItem('chat_saved_room', dmRoom(myName, name));
        window.location.reload();
      };
      list.appendChild(div);
    });
  }
  async function addContact() {
    const input = document.getElementById('add-contact-input');
    const name = input.value.trim();
    if (!name || name.toLowerCase() === myName.toLowerCase()) { input.value = ''; return; }
    const { data } = await supabase.from('profiles').select('user_name').eq('user_name', name).single();
    if (!data) { alert('Пользователь не найден'); return; }
    const contacts = getContacts();
    if (!contacts.includes(name)) { contacts.push(name); saveContacts(contacts); }
    input.value = ''; renderContacts();
  }
  function dmRoom(a, b) { const [x, y] = [a.toLowerCase(), b.toLowerCase()].sort(); return 'dm_' + x + '_' + y; }
  document.getElementById('add-contact-btn').onclick = addContact;
  document.getElementById('add-contact-input').onkeydown = (e) => { if (e.key === 'Enter') addContact(); };

  avatarEl.onclick = () => {
    const preview = document.getElementById('avatar-preview');

    document.getElementById('avatar-panel').classList.add('active');

  document.getElementById('avatar-file').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;

    const ext = file.name.split('.').pop() || 'jpg';

    const { error } = await supabase.storage.from('chat-images').upload(path, file, { contentType: file.type, upsert: true });
    if (error) { alert('Ошибка: ' + error.message); return; }
    const { data } = supabase.storage.from('chat-images').getPublicUrl(path);
    myAvatar = data.publicUrl;
    localStorage.setItem('chat_avatar_' + myName, myAvatar);
    await supabase.from('profiles').upsert({ user_name: myName, avatar_url: myAvatar });

    else el.textContent = name ? name.charAt(0).toUpperCase() : '?';
  }

    if (currentRoom.startsWith('dm_')) {
      const parts = currentRoom.replace('dm_', '').split('_');
      const other = parts.find(p => p.toLowerCase() !== myName.toLowerCase()) || parts[0];

      roomNameDisplay.textContent = '#' + currentRoom;
    }

  setAvatar(avatarEl, myName, myAvatar);
  updateHeaderTitle();
  supabase.from('profiles').upsert({ user_name: myName, avatar_url: myAvatar || null }).then(() => {}).catch(() => {});

  // ---- Чат ----
  async function initChat() {
    statusEl.textContent = 'Загрузка...';
    const { data: history, error } = await supabase.from('messages').select('*').eq('room', currentRoom).order('created_at', { ascending: true }).limit(100);
    if (!error && history) history.forEach(m => { if (!renderedIds.has(m.id)) { renderedIds.add(m.id); messageMap[m.id] = m; addMessage(m); } });
    await loadReactions();

    channel = supabase.channel('room-' + currentRoom)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + currentRoom }, (payload) => {
        const m = payload.new;
        if (renderedIds.has(m.id)) return;
        renderedIds.add(m.id); messageMap[m.id] = m; addMessage(m);
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages', filter: 'room=eq.' + currentRoom }, (payload) => {
        const el = document.getElementById('msg-' + payload.old.id);
        if (el) { el.remove(); delete messageMap[payload.old.id]; }
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') { statusEl.textContent = 'онлайн'; inputEl.disabled = false; sendBtn.disabled = false; voiceBtn.disabled = !navigator.mediaDevices; inputEl.focus(); }
      });

    supabase.channel('reactions-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'reactions' }, () => loadReactions()).subscribe();

    presenceChannel = supabase.channel('presence-' + currentRoom, { config: { presence: { key: myName } } });
    presenceChannel.on('presence', { event: 'sync' }, () => {
      const state = presenceChannel.presenceState();
      const users = Object.values(state).flat().map(p => p.user_name);
      onlineStrip.innerHTML = users.map(u => `<span class="online-badge"><span class="dot-avatar" data-name="${escapeHtml(u)}"></span>${escapeHtml(u)}</span>`).join('');
      loadAvatarsForBadges(users);
    }).subscribe(async (status) => { if (status === 'SUBSCRIBED') await presenceChannel.track({ user_name: myName }); });

    sendBtn.onclick = sendMessage;
    inputEl.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
    attachBtn.onclick = () => fileInput.click();
    fileInput.onchange = handleFileUpload;
    voiceBtn.onclick = toggleVoiceRecording;
    cancelRecording.onclick = cancelVoiceRecording;
    cancelReply.onclick = () => { replyToId = null; replyToText = ''; replyBar.classList.remove('active'); };
    document.getElementById('settings-btn').onclick = () => { window.location.href = 'settings.html'; };
  }

  async function loadAvatarsForBadges(users) {
    if (!users.length) return;
    const { data } = await supabase.from('profiles').select('user_name, avatar_url').in('user_name', users);
    (data || []).forEach(p => {
      const el = document.querySelector(`.dot-avatar[data-name="${CSS.escape(p.user_name)}"]`);
      if (el) setAvatar(el, p.user_name, p.avatar_url);
    });
  }

  async function loadReactions() {
    const { data, error } = await supabase.from('reactions').select('*');
    if (error) return;
    messageReactions = {};
    data.forEach(r => { if (!messageReactions[r.message_id]) messageReactions[r.message_id] = []; messageReactions[r.message_id].push(r); });
    document.querySelectorAll('.msg-wrap').forEach(wrap => {
      const msgId = wrap.id.replace('msg-', '');
      renderReactions(msgId, wrap.querySelector('.reactions'));
    });
  }

  function renderReactions(msgId, container) {
    if (!container) return;
    const reactions = messageReactions[msgId] || [];
    const counts = {};
    reactions.forEach(r => { if (!counts[r.emoji]) counts[r.emoji] = { count: 0, mine: false }; counts[r.emoji].count++; if (r.user_name === myName) counts[r.emoji].mine = true; });
    container.innerHTML = Object.entries(counts).map(([emoji, data]) => `<span class="reaction-badge ${data.mine ? 'mine' : ''}" data-emoji="${emoji}" data-msg="${msgId}">${emoji} ${data.count}</span>`).join('');
    container.querySelectorAll('.reaction-badge').forEach(btn => btn.onclick = () => toggleReaction(parseInt(btn.dataset.msg), btn.dataset.emoji));
  }

  async function toggleReaction(msgId, emoji) {
    const existing = (messageReactions[msgId] || []).find(r => r.user_name === myName);
    if (existing) { if (existing.emoji === emoji) await supabase.from('reactions').delete().eq('id', existing.id); else await supabase.from('reactions').update({ emoji }).eq('id', existing.id); }
    else await supabase.from('reactions').insert({ message_id: msgId, user_name: myName, emoji });
    await loadReactions();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isSending) return;
    isSending = true; sendBtn.disabled = true; inputEl.value = '';
    const { error } = await supabase.from('messages').insert({ user_name: myName, text, image_url: null, room: currentRoom, reply_to: replyToId || null });
    if (error) { statusEl.textContent = 'Ошибка: ' + error.message; inputEl.value = text; }
    else { replyToId = null; replyToText = ''; replyBar.classList.remove('active'); }
    isSending = false; sendBtn.disabled = false; inputEl.focus();
  }

  async function handleFileUpload() {
    const file = fileInput.files[0]; fileInput.value = '';
    if (!file || isSending) return;
    if (!file.type.startsWith('image/') || file.size > 5 * 1024 * 1024) { statusEl.textContent = 'Фото до 5 МБ'; return; }
    isSending = true; sendBtn.disabled = true; attachBtn.disabled = true;
    statusEl.textContent = 'Загрузка...';
    const ext = file.name.split('.').pop() || 'jpg';
    const path = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    const { error: upErr } = await supabase.storage.from('chat-images').upload(path, file, { contentType: file.type, upsert: false });
    if (upErr) { statusEl.textContent = 'Ошибка: ' + upErr.message; isSending = false; sendBtn.disabled = false; attachBtn.disabled = false; return; }
    const { data: urlData } = supabase.storage.from('chat-images').getPublicUrl(path);
    await supabase.from('messages').insert({ user_name: myName, text: '', image_url: urlData.publicUrl, room: currentRoom, reply_to: replyToId || null });
    statusEl.textContent = 'онлайн'; replyToId = null; replyToText = ''; replyBar.classList.remove('active');
    isSending = false; sendBtn.disabled = false; attachBtn.disabled = false; inputEl.focus();
  }

  async function toggleVoiceRecording() { if (!isRecording) await startVoiceRecording(); else await stopAndSendVoice(); }

  async function startVoiceRecording() {
    if (!navigator.mediaDevices) return;
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'audio/webm' });
      audioChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start();
      isRecording = true;
      voiceBtn.classList.add('recording'); voiceBtn.textContent = '➤';
      recordingStartTime = Date.now();
      recordingBar.classList.add('active');
      recordingInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - recordingStartTime) / 1000);
        recordingTime.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      }, 500);
    } catch (e) { statusEl.textContent = 'Микрофон: ' + e.message; }
  }

  async function stopAndSendVoice() {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    isRecording = false; recordingBar.classList.remove('active');
    if (recordingInterval) clearInterval(recordingInterval);
    const done = new Promise(r => { mediaRecorder.onstop = r; });
    mediaRecorder.stop(); await done;
    if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    voiceBtn.classList.remove('recording'); voiceBtn.textContent = '🎤';
    if (audioChunks.length === 0) return;
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    const path = 'voice_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.webm';
    statusEl.textContent = 'Загрузка...';
    const { error: upErr } = await supabase.storage.from('chat-images').upload(path, blob, { contentType: 'audio/webm', upsert: false });
    if (upErr) { statusEl.textContent = 'Ошибка: ' + upErr.message; return; }
    const { data: urlData } = supabase.storage.from('chat-images').getPublicUrl(path);
    await supabase.from('messages').insert({ user_name: myName, text: '', image_url: null, audio_url: urlData.publicUrl, room: currentRoom, reply_to: replyToId || null });
    statusEl.textContent = 'онлайн'; replyToId = null; replyToText = ''; replyBar.classList.remove('active');
    audioChunks = [];
  }

  function cancelVoiceRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.onstop = null; mediaRecorder.stop(); }
    if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    isRecording = false; voiceBtn.classList.remove('recording'); voiceBtn.textContent = '🎤';
    recordingBar.classList.remove('active');
    if (recordingInterval) clearInterval(recordingInterval);
    audioChunks = [];
  }

  function addMessage(m) {
    const isSelf = m.user_name === myName;
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + (isSelf ? 'self' : 'other');
    wrap.id = 'msg-' + m.id;
    wrap.style.position = 'relative';

    const div = document.createElement('div');
    div.className = 'msg ' + (isSelf ? 'self' : 'other');
    const time = m.created_at ? new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    const nameHtml = !isSelf ? `<div class="name" data-name="${escapeHtml(m.user_name)}">${escapeHtml(m.user_name)}</div>` : '';
    let replyHtml = '';
    if (m.reply_to && messageMap[m.reply_to]) {
      const r = messageMap[m.reply_to];
      replyHtml = `<div class="reply-quote">↩ ${escapeHtml(r.user_name)}: ${escapeHtml((r.text || (r.image_url ? '📷' : r.audio_url ? '🎤' : '')).slice(0, 50))}</div>`;
    }
    const pinnedMark = (pinnedId === m.id) ? '<span class="pinned-mark">📌</span>' : '';
    const textHtml = m.text ? escapeHtml(m.text) : '';
    const isSticker = m.image_url && m.image_url.startsWith('data:image/svg+xml');
    const imgHtml = m.image_url ? `<img class="${isSticker ? 'sticker' : 'attach'}" src="${escapeHtml(m.image_url)}" alt="">` : '';
    const audioHtml = m.audio_url ? `<audio controls preload="metadata" src="${escapeHtml(m.audio_url)}"></audio>` : '';
    div.innerHTML = `${nameHtml}${replyHtml}${pinnedMark}${textHtml}${imgHtml}${audioHtml}<span class="time">${time}</span>`;

    // Клик по имени → профиль
    const nameEl = div.querySelector('.name');
    if (nameEl) nameEl.onclick = (e) => { e.stopPropagation(); openProfile(m.user_name); };

    const ctx = document.createElement('div');
    ctx.className = 'ctx';
    const rBtn = document.createElement('button'); rBtn.textContent = '😊';
    rBtn.onclick = (e) => { e.stopPropagation(); const em = prompt('Эмодзи:'); if (em) toggleReaction(m.id, em); ctx.classList.remove('show'); };
    ctx.appendChild(rBtn);
    const repBtn = document.createElement('button'); repBtn.textContent = '↩';
    repBtn.onclick = (e) => {
      e.stopPropagation();
      replyToId = m.id; replyToText = m.text || (m.image_url ? '📷' : m.audio_url ? '🎤' : '');
      replyText.textContent = `Ответ ${m.user_name}: ${replyToText.slice(0, 40)}`;
      replyBar.classList.add('active'); inputEl.focus(); ctx.classList.remove('show');
    };
    ctx.appendChild(repBtn);
    const pinBtn = document.createElement('button'); pinBtn.textContent = '📌';
    pinBtn.onclick = (e) => { e.stopPropagation(); setPinned(m); ctx.classList.remove('show'); };
    ctx.appendChild(pinBtn);
    if (isSelf) {
      const eBtn = document.createElement('button'); eBtn.textContent = '✏️';
      eBtn.onclick = async (e) => { e.stopPropagation(); const t = prompt('Новый текст:', m.text || ''); if (t !== null) await supabase.from('messages').update({ text: t }).eq('id', m.id); ctx.classList.remove('show'); };
      ctx.appendChild(eBtn);
      const dBtn = document.createElement('button'); dBtn.textContent = '🗑️';
      dBtn.onclick = async (e) => { e.stopPropagation(); if (confirm('Удалить?')) await supabase.from('messages').delete().eq('id', m.id); ctx.classList.remove('show'); };
      ctx.appendChild(dBtn);
    }

    let timer = null;
    const start = () => { timer = setTimeout(() => ctx.classList.add('show'), 500); };
    const stop = () => clearTimeout(timer);
    wrap.addEventListener('touchstart', start, { passive: true });
    wrap.addEventListener('touchend', stop);
    wrap.addEventListener('touchmove', stop);
    wrap.addEventListener('mousedown', start);
    wrap.addEventListener('mouseup', stop);
    wrap.addEventListener('mouseleave', stop);

    const reactionsDiv = document.createElement('div'); reactionsDiv.className = 'reactions';
    div.appendChild(reactionsDiv);
    wrap.appendChild(div);
    wrap.appendChild(ctx);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    renderReactions(m.id, reactionsDiv);
    if (searchQuery) applySearch();
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]);
  }

  initChat();
</script>
</body>
</html>
