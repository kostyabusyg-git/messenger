<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Урал</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1d21">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d0f12; color: #e8eaed; }
  #app { position: fixed; inset: 0; max-width: 900px; margin: 0 auto; background: #1a1d21; display: flex; overflow: hidden; box-shadow: 0 0 60px rgba(0,0,0,0.5); }
  @media (min-width: 901px) { #app { top: 20px; bottom: 20px; border-radius: 16px; } }

  /* ===== ШАПКА ===== */
  #header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    background: rgba(26,29,33,0.85); backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  #header .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent, #2aabee), #1a8fd1);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: white; font-weight: 700; overflow: hidden;
    cursor: pointer; position: relative;
  }
  #header .avatar img { width: 100%; height: 100%; object-fit: cover; }
  #header .avatar::after {
    content: ''; position: absolute; bottom: 1px; right: 1px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #2ecc71; border: 2px solid #1a1d21;
  }
  #header .info { flex: 1; min-width: 0; }
  #header .info .name { font-weight: 700; font-size: 15px; color: #e8eaed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #header .info .status { font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 4px; }
  #header .info .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #2ecc71; }
  #header .icon-btn {
    background: none; border: none; color: #9ca3af; font-size: 18px;
    cursor: pointer; padding: 8px; border-radius: 10px; flex-shrink: 0;
    transition: 0.15s;
  }
  #header .icon-btn:hover { background: rgba(255,255,255,0.06); color: #e8eaed; }

  /* ===== КОНТЕНТ ===== */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding-top: 64px; position: relative; }
  #online-strip {
    padding: 8px 16px; display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  #online-strip:empty { display: none; }
  .online-badge {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    background: rgba(255,255,255,0.04); color: #9ca3af;
    padding: 3px 10px 3px 3px; border-radius: 14px; flex-shrink: 0;
  }
  .online-badge .dot-avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--accent, #2aabee); display: flex; align-items: center; justify-content: center; font-size: 10px; color: white; font-weight: 700; overflow: hidden; }
  .online-badge .dot-avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* ===== СООБЩЕНИЯ ===== */
  #messages {
    flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 16px; display: flex; flex-direction: column;
    background: var(--chat-bg, #1a1d21);
    gap: 2px;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  .msg-wrap {
    display: flex; gap: 10px; padding: 6px 8px; border-radius: 8px;
    flex-shrink: 0; transition: background 0.15s;
    animation: msgIn 0.2s ease;
  }
  @keyframes msgIn { from { opacity: 0; } to { opacity: 1; } }
  .msg-wrap:hover { background: rgba(255,255,255,0.02); }
  .msg-wrap .m-avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent, #2aabee); display: flex; align-items: center;
    justify-content: center; font-size: 14px; font-weight: 700; color: white; overflow: hidden;
  }
  .msg-wrap .m-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg-wrap .m-body { flex: 1; min-width: 0; }
  .msg-wrap .m-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .msg-wrap .m-name { font-size: 13px; font-weight: 700; color: #e8eaed; }
  .msg-wrap.self .m-name { color: var(--accent, #2aabee); }
  .msg-wrap .m-time { font-size: 11px; color: #4b5563; }
  .msg-wrap .m-text { font-size: 14px; line-height: 1.5; color: #d1d5db; word-break: break-word; }
  .msg-wrap.self .m-text { color: #e8eaed; }
  .msg-wrap .m-text img.attach { max-width: 100%; height: auto; border-radius: 10px; margin-top: 6px; display: block; cursor: pointer; }
  .msg-wrap .m-text audio { width: 100%; margin-top: 6px; border-radius: 8px; }
  .msg-wrap .reply-quote { background: rgba(255,255,255,0.04); border-left: 3px solid var(--accent, #2aabee); padding: 4px 8px; margin-bottom: 4px; border-radius: 4px; font-size: 12px; color: #9ca3af; }

  /* Контекстное меню */
  .msg-wrap .ctx {
    display: none; position: absolute; right: 16px; top: 0;
    background: #24272c; border-radius: 10px; padding: 4px; gap: 2px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 20;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .msg-wrap .ctx.show { display: flex; }
  .msg-wrap .ctx button {
    background: none; border: none; color: #9ca3af; font-size: 16px;
    cursor: pointer; padding: 6px 10px; border-radius: 6px;
  }
  .msg-wrap .ctx button:hover { background: rgba(255,255,255,0.06); color: #e8eaed; }

  .reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .reaction-badge {
    font-size: 11px; background: rgba(255,255,255,0.04); color: #d1d5db;
    padding: 2px 8px; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent;
  }
  .reaction-badge.mine { background: rgba(42,171,238,0.15); color: var(--accent, #2aabee); border-color: rgba(42,171,238,0.3); }

  /* ===== ПОЛЕ ВВОДА ===== */
  #input-area {
    padding: 12px 16px; display: flex; gap: 8px; align-items: center; flex-shrink: 0;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: rgba(26,29,33,0.9); backdrop-filter: blur(16px);
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  #attach, #voice-btn {
    width: 40px; height: 40px; border: none; border-radius: 50%;
    background: rgba(255,255,255,0.04); color: #9ca3af; font-size: 17px;
    cursor: pointer; flex-shrink: 0; transition: 0.15s;
  }
  #attach:hover, #voice-btn:hover { background: rgba(255,255,255,0.08); color: #e8eaed; }
  #attach:disabled, #voice-btn:disabled { opacity: 0.4; }
  #voice-btn.recording { background: #e74c3c; color: white; animation: pulse-rec 1s infinite; }
  @keyframes pulse-rec { 0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.4); } 50% { box-shadow: 0 0 0 8px rgba(231,76,60,0); } }
  #input {
    flex: 1; padding: 12px 18px; border: 1px solid rgba(255,255,255,0.06);
    border-radius: 24px; background: rgba(255,255,255,0.04);
    color: #e8eaed; font-size: 14px; outline: none; min-width: 0;
    transition: 0.15s;
  }
  #input:focus { background: rgba(255,255,255,0.06); border-color: rgba(42,171,238,0.4); }
  #input::placeholder { color: #4b5563; }
  #send {
    width: 44px; height: 44px; border: none; border-radius: 50%;
    background: var(--accent, #2aabee); color: white; font-size: 18px;
    cursor: pointer; flex-shrink: 0; transition: 0.15s;
    box-shadow: 0 4px 12px rgba(42,171,238,0.3);
  }
  #send:hover { filter: brightness(1.1); }
  #send:disabled { background: #2a2d32; box-shadow: none; }

  #reply-bar { display: none; padding: 8px 16px; background: rgba(42,171,238,0.08); border-top: 1px solid rgba(42,171,238,0.15); font-size: 12px; color: #9ca3af; align-items: center; gap: 8px; }
  #reply-bar.active { display: flex; }
  #reply-bar .text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #reply-bar button { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 16px; }

  #recording-bar { display: none; padding: 8px 16px; background: rgba(231,76,60,0.1); border-top: 1px solid rgba(231,76,60,0.2); font-size: 12px; color: #e74c3c; align-items: center; gap: 8px; }
  #recording-bar.active { display: flex; }
  #recording-bar .dot { width: 10px; height: 10px; border-radius: 50%; background: #e74c3c; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  /* ===== DRAWER КОНТАКТОВ ===== */
  #drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 100; }
  #drawer-overlay.active { display: block; }
  #drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 280px; max-width: 85vw;
    background: #1a1d21; z-index: 101; display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.21, 1.02, 0.73, 1);
    box-shadow: 4px 0 24px rgba(0,0,0,0.5);
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  #drawer.open { transform: translateX(0); }
  #drawer-header { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  #drawer-header h2 { font-size: 18px; font-weight: 700; color: var(--accent, #2aabee); margin-bottom: 12px; }
  #add-contact-row { display: flex; gap: 6px; }
  #add-contact-row input { flex: 1; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; background: rgba(255,255,255,0.04); color: #e8eaed; font-size: 13px; outline: none; }
  #add-contact-row input:focus { border-color: rgba(42,171,238,0.4); }
  #add-contact-row button { padding: 8px 12px; border: none; border-radius: 10px; background: var(--accent, #2aabee); color: white; font-size: 13px; font-weight: 700; cursor: pointer; }
  #contacts-list { flex: 1; overflow-y: auto; padding: 8px; }
  .contact-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; transition: background 0.15s; }
  .contact-item:hover { background: rgba(255,255,255,0.04); }
  .contact-item .c-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent, #2aabee); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: white; flex-shrink: 0; overflow: hidden; }
  .contact-item .c-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .contact-item .c-name { flex: 1; font-size: 14px; color: #e8eaed; }
  .contact-item .c-del { background: none; border: none; color: #4b5563; font-size: 14px; cursor: pointer; padding: 4px; }
  #drawer-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06); }
  #drawer-footer button { width: 100%; padding: 10px; border: none; border-radius: 10px; background: rgba(255,255,255,0.04); color: #9ca3af; font-size: 13px; cursor: pointer; }
  #drawer-footer button:hover { background: rgba(255,255,255,0.08); color: #e8eaed; }

  /* ===== АВАТАРКА ===== */
  #avatar-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 110; backdrop-filter: blur(4px); }
  #avatar-panel.active { display: flex; }
  #avatar-inner { background: #24272c; border-radius: 20px; padding: 24px; width: 90%; max-width: 320px; text-align: center; color: #e8eaed; border: 1px solid rgba(255,255,255,0.06); }
  #avatar-inner h3 { margin-bottom: 16px; font-size: 17px; }
  #avatar-preview { width: 120px; height: 120px; border-radius: 50%; background: var(--accent, #2aabee); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 48px; color: white; font-weight: 700; overflow: hidden; }
  #avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  #avatar-inner input[type=file] { display: none; }
  #avatar-inner label { display: inline-block; padding: 10px 20px; border-radius: 12px; background: rgba(255,255,255,0.06); color: #e8eaed; font-size: 14px; cursor: pointer; margin-bottom: 10px; }
  #avatar-close { width: 100%; padding: 12px; border: none; border-radius: 12px; background: rgba(255,255,255,0.04); color: #9ca3af; font-size: 14px; cursor: pointer; margin-top: 8px; }

  @media (max-width: 700px) {
    #app { border-radius: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="avatar" id="user-avatar">?</div>
    <div class="info">
      <div class="name" id="room-name-display">Комната</div>
      <div class="status" id="status">Подключение...</div>
    </div>
    <button class="icon-btn" id="notify-btn" title="Уведомления">🔔</button>
    <button class="icon-btn" id="contacts-btn" title="Контакты">☰</button>
    <button class="icon-btn" id="settings-btn" title="Настройки">⚙️</button>
  </div>

  <div id="main">
    <div id="online-strip"></div>
    <div id="messages"></div>
    <div id="reply-bar">
      <span class="text" id="reply-text"></span>
      <button id="cancel-reply">✕</button>
    </div>
    <div id="recording-bar">
      <span class="dot"></span>
      <span id="recording-time">0:00</span>
      <span style="flex:1"></span>
      <button id="cancel-recording" style="color:#e74c3c;background:none;border:none;font-size:18px;cursor:pointer;">✕</button>
    </div>
    <div id="input-area">
      <button id="attach" title="Фото">📎</button>
      <input type="file" id="file-input" accept="image/*" hidden>
      <input type="text" id="input" placeholder="Сообщение..." disabled>
      <button id="voice-btn" title="Голосовое" disabled>🎤</button>
      <button id="send" disabled>➤</button>
    </div>
  </div>
</div>

<div id="drawer-overlay"></div>
<div id="drawer">
  <div id="drawer-header">
    <h2>Урал</h2>
    <div id="add-contact-row">
      <input type="text" id="add-contact-input" placeholder="Имя пользователя" maxlength="20">
      <button id="add-contact-btn">+</button>
    </div>
  </div>
  <div id="contacts-list"></div>
  <div id="drawer-footer">
    <button id="drawer-close">Закрыть</button>
  </div>
</div>

<div id="avatar-panel">
  <div id="avatar-inner">
    <h3>Аватарка</h3>
    <div id="avatar-preview">?</div>
    <input type="file" id="avatar-file" accept="image/*">
    <label for="avatar-file">Выбрать фото</label>
    <button id="avatar-close">Закрыть</button>
  </div>
</div>

<script type="module">
  const SUPABASE_URL = 'https://ekqnbtjjqatvwsxlzenr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_AK4tP549G2IjTkSOeNvC4g_Z2ViaGc_';
  const VAPID_PUBLIC_KEY = 'BBi0jwVf2KNsNhFJNffFdjH4EaUTVBN72bmCZPuVrXFB5HuHNstO44tfXj91TcPRVIxeNqkNCdncE8tR19Kzj7M';

  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const myName = localStorage.getItem('chat_saved_name');
  const currentRoom = localStorage.getItem('chat_saved_room');
  if (!myName || !currentRoom) { window.location.href = 'index.html'; }

  document.documentElement.style.setProperty('--accent', localStorage.getItem('chat_accent') || '#2aabee');
  document.documentElement.style.setProperty('--chat-bg', localStorage.getItem('chat_bg') || '#1a1d21');

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const avatarEl = document.getElementById('user-avatar');
  const roomNameDisplay = document.getElementById('room-name-display');
  const attachBtn = document.getElementById('attach');
  const fileInput = document.getElementById('file-input');
  const onlineStrip = document.getElementById('online-strip');
  const replyBar = document.getElementById('reply-bar');
  const replyText = document.getElementById('reply-text');
  const cancelReply = document.getElementById('cancel-reply');
  const voiceBtn = document.getElementById('voice-btn');
  const recordingBar = document.getElementById('recording-bar');
  const recordingTime = document.getElementById('recording-time');
  const cancelRecording = document.getElementById('cancel-recording');
  const drawer = document.getElementById('drawer');
  const drawerOverlay = document.getElementById('drawer-overlay');

  let isSending = false;
  let replyToId = null;
  let replyToText = '';
  const renderedIds = new Set();
  let messageReactions = {};
  let messageMap = {};
  let channel = null;
  let presenceChannel = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let recordingStartTime = 0;
  let recordingInterval = null;
  let isRecording = false;
  let currentStream = null;
  let myAvatar = localStorage.getItem('chat_avatar_' + myName) || '';

  function updateHeaderTitle() {
    if (currentRoom.startsWith('dm_')) {
      const parts = currentRoom.replace('dm_', '').split('_');
      const other = parts.find(p => p.toLowerCase() !== myName.toLowerCase()) || parts[0];
      roomNameDisplay.textContent = other;
    } else {
      roomNameDisplay.textContent = '#' + currentRoom;
    }
  }

  function setAvatar(el, name, url) {
    if (url) el.innerHTML = `<img src="${escapeHtml(url)}" alt="">`;
    else el.textContent = name ? name.charAt(0).toUpperCase() : '?';
  }

  setAvatar(avatarEl, myName, myAvatar);
  updateHeaderTitle();
  supabase.from('profiles').upsert({ user_name: myName, avatar_url: myAvatar || null }).then(() => {}).catch(() => {});

  // Push
  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
  }

  document.getElementById('notify-btn').onclick = async () => {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { statusEl.textContent = 'Не поддерживается'; return; }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { statusEl.textContent = 'Запрещено'; return; }
    try {
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      const json = sub.toJSON();
      const { error } = await supabase.from('push_subscriptions').upsert({ user_name: myName, endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth }, { onConflict: 'endpoint' });
      if (error) statusEl.textContent = 'Ошибка: ' + error.message;
      else statusEl.textContent = '🔔 Включены';
    } catch (e) { statusEl.textContent = 'Ошибка: ' + e.message; }
  };

  // Drawer
  function openDrawer() { drawer.classList.add('open'); drawerOverlay.classList.add('active'); renderContacts(); }
  function closeDrawer() { drawer.classList.remove('open'); drawerOverlay.classList.remove('active'); }
  document.getElementById('contacts-btn').onclick = openDrawer;
  document.getElementById('drawer-close').onclick = closeDrawer;
  drawerOverlay.onclick = closeDrawer;

  // Контакты
  function getContacts() { return JSON.parse(localStorage.getItem('chat_contacts') || '[]'); }
  function saveContacts(list) { localStorage.setItem('chat_contacts', JSON.stringify(list)); }

  async function renderContacts() {
    const list = document.getElementById('contacts-list');
    const contacts = getContacts();
    if (contacts.length === 0) { list.innerHTML = '<p style="color:#4b5563;font-size:13px;padding:20px;text-align:center;">Нет контактов</p>'; return; }
    list.innerHTML = '';
    const { data } = await supabase.from('profiles').select('user_name, avatar_url').in('user_name', contacts);
    const map = {}; (data || []).forEach(p => map[p.user_name] = p.avatar_url);
    contacts.forEach(name => {
      const div = document.createElement('div');
      div.className = 'contact-item';
      div.innerHTML = `<div class="c-avatar"></div><div class="c-name">${escapeHtml(name)}</div><button class="c-del">✕</button>`;
      setAvatar(div.querySelector('.c-avatar'), name, map[name]);
      div.onclick = (e) => {
        if (e.target.classList.contains('c-del')) { saveContacts(contacts.filter(c => c !== name)); renderContacts(); return; }
        localStorage.setItem('chat_saved_room', dmRoom(myName, name));
        window.location.reload();
      };
      list.appendChild(div);
    });
  }

  async function addContact() {
    const input = document.getElementById('add-contact-input');
    const name = input.value.trim();
    if (!name || name.toLowerCase() === myName.toLowerCase()) { input.value = ''; return; }
    const { data } = await supabase.from('profiles').select('user_name').eq('user_name', name).single();
    if (!data) { alert('Пользователь не найден'); return; }
    const contacts = getContacts();
    if (!contacts.includes(name)) { contacts.push(name); saveContacts(contacts); }
    input.value = '';
    renderContacts();
  }

  function dmRoom(a, b) { const [x, y] = [a.toLowerCase(), b.toLowerCase()].sort(); return 'dm_' + x + '_' + y; }

  // Аватарка
  document.getElementById('avatar-close').onclick = () => document.getElementById('avatar-panel').classList.remove('active');
  avatarEl.onclick = () => {
    const preview = document.getElementById('avatar-preview');
    setAvatar(preview, myName, myAvatar);
    document.getElementById('avatar-panel').classList.add('active');
  };
  document.getElementById('avatar-file').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    if (!file.type.startsWith('image/') || file.size > 2 * 1024 * 1024) { alert('Только фото до 2 МБ'); return; }
    const ext = file.name.split('.').pop() || 'jpg';
    const path = `avatar_${myName}_${Date.now()}.${ext}`;
    const { error } = await supabase.storage.from('chat-images').upload(path, file, { contentType: file.type, upsert: true });
    if (error) { alert('Ошибка: ' + error.message); return; }
    const { data } = supabase.storage.from('chat-images').getPublicUrl(path);
    myAvatar = data.publicUrl;
    localStorage.setItem('chat_avatar_' + myName, myAvatar);
    await supabase.from('profiles').upsert({ user_name: myName, avatar_url: myAvatar });
    setAvatar(avatarEl, myName, myAvatar);
    setAvatar(document.getElementById('avatar-preview'), myName, myAvatar);
    document.getElementById('avatar-panel').classList.remove('active');
  };

  // Чат
  async function initChat() {
    statusEl.textContent = 'Загрузка...';
    const { data: history, error } = await supabase.from('messages').select('*').eq('room', currentRoom).order('created_at', { ascending: true }).limit(100);
    if (!error && history) history.forEach(m => { if (!renderedIds.has(m.id)) { renderedIds.add(m.id); messageMap[m.id] = m; addMessage(m); } });
    await loadReactions();

    channel = supabase.channel('room-' + currentRoom)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + currentRoom }, (payload) => {
        const m = payload.new;
        if (renderedIds.has(m.id)) return;
        renderedIds.add(m.id); messageMap[m.id] = m; addMessage(m);
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages', filter: 'room=eq.' + currentRoom }, (payload) => {
        const el = document.getElementById('msg-' + payload.old.id);
        if (el) { el.remove(); delete messageMap[payload.old.id]; }
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') { statusEl.textContent = 'онлайн'; inputEl.disabled = false; sendBtn.disabled = false; voiceBtn.disabled = !navigator.mediaDevices; inputEl.focus(); }
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') statusEl.textContent = 'Переподключение...';
      });

    supabase.channel('reactions-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'reactions' }, () => loadReactions()).subscribe();

    presenceChannel = supabase.channel('presence-' + currentRoom, { config: { presence: { key: myName } } });
    presenceChannel.on('presence', { event: 'sync' }, () => {
      const state = presenceChannel.presenceState();
      const users = Object.values(state).flat().map(p => p.user_name);
      onlineStrip.innerHTML = users.map(u => `<span class="online-badge"><span class="dot-avatar" data-name="${escapeHtml(u)}"></span>${escapeHtml(u)}</span>`).join('');
      loadAvatarsForBadges(users);
    }).subscribe(async (status) => { if (status === 'SUBSCRIBED') await presenceChannel.track({ user_name: myName }); });

    sendBtn.onclick = sendMessage;
    inputEl.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
    attachBtn.onclick = () => fileInput.click();
    fileInput.onchange = handleFileUpload;
    voiceBtn.onclick = toggleVoiceRecording;
    cancelRecording.onclick = cancelVoiceRecording;
    cancelReply.onclick = () => { replyToId = null; replyToText = ''; replyBar.classList.remove('active'); };
    document.getElementById('settings-btn').onclick = () => { window.location.href = 'settings.html'; };
    document.getElementById('add-contact-btn').onclick = addContact;
    document.getElementById('add-contact-input').onkeydown = (e) => { if (e.key === 'Enter') addContact(); };
  }

  async function loadAvatarsForBadges(users) {
    if (!users.length) return;
    const { data } = await supabase.from('profiles').select('user_name, avatar_url').in('user_name', users);
    (data || []).forEach(p => {
      const el = document.querySelector(`.dot-avatar[data-name="${CSS.escape(p.user_name)}"]`);
      if (el) setAvatar(el, p.user_name, p.avatar_url);
    });
  }

  async function loadReactions() {
    const { data, error } = await supabase.from('reactions').select('*');
    if (error) return;
    messageReactions = {};
    data.forEach(r => { if (!messageReactions[r.message_id]) messageReactions[r.message_id] = []; messageReactions[r.message_id].push(r); });
    document.querySelectorAll('.msg-wrap').forEach(wrap => {
      const msgId = wrap.id.replace('msg-', '');
      renderReactions(msgId, wrap.querySelector('.reactions'));
    });
  }

  function renderReactions(msgId, container) {
    if (!container) return;
    const reactions = messageReactions[msgId] || [];
    const counts = {};
    reactions.forEach(r => { if (!counts[r.emoji]) counts[r.emoji] = { count: 0, mine: false }; counts[r.emoji].count++; if (r.user_name === myName) counts[r.emoji].mine = true; });
    container.innerHTML = Object.entries(counts).map(([emoji, data]) => `<span class="reaction-badge ${data.mine ? 'mine' : ''}" data-emoji="${emoji}" data-msg="${msgId}">${emoji} ${data.count}</span>`).join('');
    container.querySelectorAll('.reaction-badge').forEach(btn => btn.onclick = () => toggleReaction(parseInt(btn.dataset.msg), btn.dataset.emoji));
  }

  async function toggleReaction(msgId, emoji) {
    const existing = (messageReactions[msgId] || []).find(r => r.user_name === myName);
    if (existing) { if (existing.emoji === emoji) await supabase.from('reactions').delete().eq('id', existing.id); else await supabase.from('reactions').update({ emoji }).eq('id', existing.id); }
    else await supabase.from('reactions').insert({ message_id: msgId, user_name: myName, emoji });
    await loadReactions();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isSending) return;
    isSending = true; sendBtn.disabled = true; inputEl.value = '';
    const { error } = await supabase.from('messages').insert({ user_name: myName, text, image_url: null, room: currentRoom, reply_to: replyToId || null });
    if (error) { statusEl.textContent = 'Ошибка: ' + error.message; inputEl.value = text; }
    else { replyToId = null; replyToText = ''; replyBar.classList.remove('active'); }
    isSending = false; sendBtn.disabled = false; inputEl.focus();
  }

  async function handleFileUpload() {
    const file = fileInput.files[0]; fileInput.value = '';
    if (!file || isSending) return;
    if (!file.type.startsWith('image/') || file.size > 5 * 1024 * 1024) { statusEl.textContent = 'Фото до 5 МБ'; return; }
    isSending = true; sendBtn.disabled = true; attachBtn.disabled = true;
    statusEl.textContent = 'Загрузка...';
    const ext = file.name.split('.').pop() || 'jpg';
    const path = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    const { error: upErr } = await supabase.storage.from('chat-images').upload(path, file, { contentType: file.type, upsert: false });
    if (upErr) { statusEl.textContent = 'Ошибка: ' + upErr.message; isSending = false; sendBtn.disabled = false; attachBtn.disabled = false; return; }
    const { data: urlData } = supabase.storage.from('chat-images').getPublicUrl(path);
    await supabase.from('messages').insert({ user_name: myName, text: '', image_url: urlData.publicUrl, room: currentRoom, reply_to: replyToId || null });
    statusEl.textContent = 'онлайн'; replyToId = null; replyToText = ''; replyBar.classList.remove('active');
    isSending = false; sendBtn.disabled = false; attachBtn.disabled = false; inputEl.focus();
  }

  async function toggleVoiceRecording() { if (!isRecording) await startVoiceRecording(); else await stopAndSendVoice(); }

  async function startVoiceRecording() {
    if (!navigator.mediaDevices) return;
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'audio/webm' });
      audioChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start();
      isRecording = true;
      voiceBtn.classList.add('recording'); voiceBtn.textContent = '➤';
      recordingStartTime = Date.now();
      recordingBar.classList.add('active');
      recordingInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - recordingStartTime) / 1000);
        recordingTime.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      }, 500);
    } catch (e) { statusEl.textContent = 'Микрофон: ' + e.message; }
  }

  async function stopAndSendVoice() {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    isRecording = false; recordingBar.classList.remove('active');
    if (recordingInterval) clearInterval(recordingInterval);
    const done = new Promise(r => { mediaRecorder.onstop = r; });
    mediaRecorder.stop(); await done;
    if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    voiceBtn.classList.remove('recording'); voiceBtn.textContent = '🎤';
    if (audioChunks.length === 0) return;
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    const path = 'voice_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.webm';
    statusEl.textContent = 'Загрузка...';
    const { error: upErr } = await supabase.storage.from('chat-images').upload(path, blob, { contentType: 'audio/webm', upsert: false });
    if (upErr) { statusEl.textContent = 'Ошибка: ' + upErr.message; return; }
    const { data: urlData } = supabase.storage.from('chat-images').getPublicUrl(path);
    await supabase.from('messages').insert({ user_name: myName, text: '', image_url: null, audio_url: urlData.publicUrl, room: currentRoom, reply_to: replyToId || null });
    statusEl.textContent = 'онлайн'; replyToId = null; replyToText = ''; replyBar.classList.remove('active');
    audioChunks = [];
  }

  function cancelVoiceRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.onstop = null; mediaRecorder.stop(); }
    if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    isRecording = false; voiceBtn.classList.remove('recording'); voiceBtn.textContent = '🎤';
    recordingBar.classList.remove('active');
    if (recordingInterval) clearInterval(recordingInterval);
    audioChunks = [];
  }

  async function addMessage(m) {
    const isSelf = m.user_name === myName;
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + (isSelf ? 'self' : 'other');
    wrap.id = 'msg-' + m.id;
    wrap.style.position = 'relative';

    const avatarDiv = document.createElement('div');
    avatarDiv.className = 'm-avatar';
    avatarDiv.textContent = m.user_name.charAt(0).toUpperCase();
    // Подгрузим аватарку асинхронно
    supabase.from('profiles').select('avatar_url').eq('user_name', m.user_name).single().then(({ data }) => {
      if (data && data.avatar_url) avatarDiv.innerHTML = `<img src="${escapeHtml(data.avatar_url)}" alt="">`;
    }).catch(() => {});

    const bodyDiv = document.createElement('div');
    bodyDiv.className = 'm-body';

    const time = m.created_at ? new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    const headHtml = `<div class="m-head"><span class="m-name">${escapeHtml(m.user_name)}</span><span class="m-time">${time}</span></div>`;
    let replyHtml = '';
    if (m.reply_to && messageMap[m.reply_to]) {
      const r = messageMap[m.reply_to];
      replyHtml = `<div class="reply-quote">↩ ${escapeHtml(r.user_name)}: ${escapeHtml((r.text || (r.image_url ? '📷' : r.audio_url ? '🎤' : '')).slice(0, 50))}</div>`;
    }
    const textHtml = m.text ? `<div class="m-text">${escapeHtml(m.text)}</div>` : '';
    const imgHtml = m.image_url ? `<div class="m-text"><img class="attach" src="${escapeHtml(m.image_url)}" alt=""></div>` : '';
    const audioHtml = m.audio_url ? `<div class="m-text"><audio controls preload="metadata" src="${escapeHtml(m.audio_url)}"></audio></div>` : '';
    bodyDiv.innerHTML = headHtml + replyHtml + textHtml + imgHtml + audioHtml;

    const ctx = document.createElement('div');
    ctx.className = 'ctx';
    const rBtn = document.createElement('button'); rBtn.textContent = '😊';
    rBtn.onclick = (e) => { e.stopPropagation(); const em = prompt('Эмодзи:'); if (em) toggleReaction(m.id, em); ctx.classList.remove('show'); };
    ctx.appendChild(rBtn);
    const repBtn = document.createElement('button'); repBtn.textContent = '↩';
    repBtn.onclick = (e) => {
      e.stopPropagation();
      replyToId = m.id; replyToText = m.text || (m.image_url ? '📷' : m.audio_url ? '🎤' : '');
      replyText.textContent = `Ответ ${m.user_name}: ${replyToText.slice(0, 40)}`;
      replyBar.classList.add('active'); inputEl.focus(); ctx.classList.remove('show');
    };
    ctx.appendChild(repBtn);
    if (isSelf) {
      const eBtn = document.createElement('button'); eBtn.textContent = '✏️';
      eBtn.onclick = async (e) => { e.stopPropagation(); const t = prompt('Новый текст:', m.text || ''); if (t !== null) await supabase.from('messages').update({ text: t }).eq('id', m.id); ctx.classList.remove('show'); };
      ctx.appendChild(eBtn);
      const dBtn = document.createElement('button'); dBtn.textContent = '🗑️';
      dBtn.onclick = async (e) => { e.stopPropagation(); if (confirm('Удалить?')) await supabase.from('messages').delete().eq('id', m.id); ctx.classList.remove('show'); };
      ctx.appendChild(dBtn);
    }

    let timer = null;
    const start = () => { timer = setTimeout(() => ctx.classList.add('show'), 500); };
    const stop = () => clearTimeout(timer);
    wrap.addEventListener('touchstart', start, { passive: true });
    wrap.addEventListener('touchend', stop);
    wrap.addEventListener('touchmove', stop);
    wrap.addEventListener('mousedown', start);
    wrap.addEventListener('mouseup', stop);
    wrap.addEventListener('mouseleave', stop);
    document.addEventListener('click', (e) => { if (!wrap.contains(e.target)) ctx.classList.remove('show'); });

    const reactionsDiv = document.createElement('div'); reactionsDiv.className = 'reactions';
    bodyDiv.appendChild(reactionsDiv);

    wrap.appendChild(avatarDiv);
    wrap.appendChild(bodyDiv);
    wrap.appendChild(ctx);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    renderReactions(m.id, reactionsDiv);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]);
  }

  initChat();
</script>
</body>
</html>
