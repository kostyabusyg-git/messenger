<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Урал мессенджер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0e1621; color: #f5f5f5; }
  #app { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: #17212b; display: flex; flex-direction: column; overflow: hidden; }
  @media (min-width: 481px) { #app { top: 20px; bottom: 20px; border-radius: 16px; } }

  /* ЭКРАН ВХОДА — строго по центру */
  #auth-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 30px;
    overflow-y: auto;
  }
  #auth-screen > * { flex-shrink: 0; }

  #auth-screen .logo {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2aabee, #229ed9);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(42,171,238,0.3);
  }
  #auth-screen .logo svg { display: block; }
  #auth-screen h2 { font-weight: 600; font-size: 22px; }
  #auth-screen .subtitle { font-size: 13px; color: #7d8b99; margin-top: -10px; }

  .auth-tabs { display: flex; gap: 8px; background: #1c2733; padding: 4px; border-radius: 24px; }
  .auth-tab { padding: 10px 24px; border: none; border-radius: 20px; background: transparent; color: #7d8b99; font-size: 14px; cursor: pointer; font-weight: 500; }
  .auth-tab.active { background: #2aabee; color: white; }

  .auth-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
  .auth-form.hidden { display: none; }
  .auth-form input {
    width: 100%; padding: 14px 20px;
    border: 1px solid #2b3a4a; border-radius: 28px;
    background: #242f3d; color: #f5f5f5; font-size: 15px;
    outline: none; text-align: center;
  }
  .auth-form input:focus { border-color: #2aabee; }
  .auth-form button {
    padding: 14px; border: none; border-radius: 28px;
    background: #2aabee; color: white;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .auth-form button:active { transform: scale(0.97); }
  #auth-error { color: #e74c3c; font-size: 13px; min-height: 20px; text-align: center; }

  /* ЧАТ */
  #chat-screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #chat-screen.hidden { display: none !important; }
  #header { padding: 14px 18px; background: #1c2733; border-bottom: 1px solid #101921; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #header .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #2aabee, #229ed9); display: flex; align-items: center; justify-content: center; font-size: 19px; color: white; font-weight: 600; flex-shrink: 0; }
  #header .info { flex: 1; min-width: 0; }
  #header .info .name { font-weight: 600; font-size: 15px; }
  #header .info .status { font-size: 12px; color: #7d8b99; }
  #header .icon-btn { background: none; border: none; color: #7d8b99; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 10px; }
  #header .icon-btn:hover { background: #242f3d; color: #fff; }

  #messages { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--chat-bg, #0e1621); }
  .msg-wrap { display: flex; flex-direction: column; flex-shrink: 0; }
  .msg-wrap.self { align-self: flex-end; align-items: flex-end; }
  .msg-wrap.other { align-self: flex-start; align-items: flex-start; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; word-break: break-word; }
  .msg.self { background: #2b5278; color: #fff; border-bottom-right-radius: 6px; }
  .msg.other { background: #182533; color: #e1e1e1; border-bottom-left-radius: 6px; }
  .msg .name { font-size: 11px; font-weight: 600; color: #6ab3f3; margin-bottom: 3px; }
  .msg .time { font-size: 10px; color: #7d8b99; float: right; margin-left: 8px; margin-top: 4px; }
  .msg img { max-width: 100%; height: auto; border-radius: 10px; margin-top: 6px; display: block; }

  #input-area { padding: 10px 14px; background: #1c2733; border-top: 1px solid #101921; display: flex; gap: 6px; align-items: center; flex-shrink: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  #attach { width: 38px; height: 38px; border: none; border-radius: 50%; background: #242f3d; color: #a0b0c0; font-size: 17px; cursor: pointer; flex-shrink: 0; }
  #input { flex: 1; padding: 11px 16px; border: none; border-radius: 22px; background: #242f3d; color: #f5f5f5; font-size: 14px; outline: none; min-width: 0; }
  #input::placeholder { color: #6c7883; }
  #send { width: 42px; height: 42px; border: none; border-radius: 50%; background: #2aabee; color: white; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  #send:disabled { background: #3a4a5a; }

  /* НАСТРОЙКИ */
  #settings-screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #settings-screen.hidden { display: none !important; }
  #settings-header { padding: 16px 18px; background: #1c2733; border-bottom: 1px solid #101921; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #settings-header h2 { font-size: 18px; font-weight: 600; flex: 1; }
  #settings-header button { background: none; border: none; color: #7d8b99; font-size: 22px; cursor: pointer; padding: 4px 8px; }
  #settings-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .settings-section { background: #1c2733; border-radius: 14px; padding: 16px; }
  .settings-section h3 { font-size: 13px; color: #7d8b99; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #242f3d; font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .value { color: #7d8b99; }
  .btn-danger { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #3a2a2a; color: #e74c3c; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<div id="app">
  <div id="auth-screen">
    <div class="logo">
      <svg viewBox="0 0 100 100" width="56" height="56" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 70 L30 35 L45 55 L60 25 L90 70 Z" fill="#ffffff" opacity="0.95"/>
        <path d="M60 25 L70 40 L65 42 L60 35 L55 42 L50 40 Z" fill="#e8f4ff" opacity="0.9"/>
        <text x="50" y="88" font-family="sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">У</text>
      </svg>
    </div>
    <h2>Урал мессенджер</h2>
    <div class="subtitle">Общайся с миром</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">Войти</button>
      <button class="auth-tab" id="tab-create">Создать</button>
    </div>
    <div class="auth-form" id="form-login">
      <input type="text" id="login-name" placeholder="Ваше имя" maxlength="20">
      <input type="text" id="login-room" placeholder="Имя комнаты" maxlength="20">
      <input type="password" id="login-password" placeholder="Пароль комнаты" maxlength="30">
      <button id="login-btn">Войти в чат</button>
    </div>
    <div class="auth-form hidden" id="form-create">
      <input type="text" id="create-name" placeholder="Ваше имя" maxlength="20">
      <input type="text" id="create-room" placeholder="Название комнаты" maxlength="20">
      <input type="password" id="create-password" placeholder="Придумайте пароль" maxlength="30">
      <button id="create-btn">Создать комнату</button>
    </div>
    <div id="auth-error"></div>
  </div>

  <div id="chat-screen" class="hidden">
    <div id="header">
      <div class="avatar" id="user-avatar">?</div>
      <div class="info">
        <div class="name" id="room-name-display">Комната</div>
        <div class="status" id="status">Подключение...</div>
      </div>
      <button class="icon-btn" id="settings-btn">⚙️</button>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <button id="attach" title="Фото">📎</button>
      <input type="file" id="file-input" accept="image/*" hidden>
      <input type="text" id="input" placeholder="Написать сообщение..." disabled>
      <button id="send" disabled>➤</button>
    </div>
  </div>

  <div id="settings-screen" class="hidden">
    <div id="settings-header">
      <button id="settings-back">←</button>
      <h2>Настройки</h2>
    </div>
    <div id="settings-content">
      <div class="settings-section">
        <h3>Профиль</h3>
        <div class="info-row"><span>Имя</span><span class="value" id="profile-name">—</span></div>
        <div class="info-row"><span>Комната</span><span class="value" id="profile-room">—</span></div>
      </div>
      <div class="settings-section">
        <h3>Действия</h3>
        <button class="btn-danger" id="logout-btn">🚪 Выйти из комнаты</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  const SUPABASE_URL = 'https://ekqnbtjjqatvwsxlzenr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_AK4tP549G2IjTkSOeNvC4g_Z2ViaGc_';

  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const authScreen = document.getElementById('auth-screen');
  const chatScreen = document.getElementById('chat-screen');
  const settingsScreen = document.getElementById('settings-screen');
  const tabLogin = document.getElementById('tab-login');
  const tabCreate = document.getElementById('tab-create');
  const formLogin = document.getElementById('form-login');
  const formCreate = document.getElementById('form-create');
  const authError = document.getElementById('auth-error');
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const avatarEl = document.getElementById('user-avatar');
  const settingsBtn = document.getElementById('settings-btn');
  const settingsBack = document.getElementById('settings-back');
  const attachBtn = document.getElementById('attach');
  const fileInput = document.getElementById('file-input');
  const roomNameDisplay = document.getElementById('room-name-display');

  let myName = '';
  let currentRoom = '';
  let channel = null;
  let isSending = false;
  const renderedIds = new Set();

  // Переключение вкладок — просто и надёжно
  tabLogin.onclick = () => {
    tabLogin.classList.add('active');
    tabCreate.classList.remove('active');
    formLogin.classList.remove('hidden');
    formCreate.classList.add('hidden');
    authError.textContent = '';
  };
  tabCreate.onclick = () => {
    tabCreate.classList.add('active');
    tabLogin.classList.remove('active');
    formCreate.classList.remove('hidden');
    formLogin.classList.add('hidden');
    authError.textContent = '';
  };

  // Создание комнаты
  document.getElementById('create-btn').onclick = async () => {
    const name = document.getElementById('create-name').value.trim();
    const room = document.getElementById('create-room').value.trim().toLowerCase().replace(/\s+/g, '-');
    const pass = document.getElementById('create-password').value.trim();
    if (!name || !room || !pass) { authError.textContent = 'Заполните все поля'; return; }
    const { error } = await supabase.from('rooms').insert({ name: room, password: pass });
    if (error) { authError.textContent = error.code === '23505' ? 'Комната уже есть' : 'Ошибка: ' + error.message; return; }
    myName = name; currentRoom = room;
    localStorage.setItem('chat_saved_name', myName);
    localStorage.setItem('chat_saved_room', currentRoom);
    enterChat();
  };

  // Вход
  document.getElementById('login-btn').onclick = async () => {
    const name = document.getElementById('login-name').value.trim();
    const room = document.getElementById('login-room').value.trim().toLowerCase().replace(/\s+/g, '-');
    const pass = document.getElementById('login-password').value.trim();
    if (!name || !room || !pass) { authError.textContent = 'Заполните все поля'; return; }
    const { data, error } = await supabase.from('rooms').select('password').eq('name', room).single();
    if (error || !data) { authError.textContent = 'Комната не найдена'; return; }
    if (data.password !== pass) { authError.textContent = 'Неверный пароль'; return; }
    myName = name; currentRoom = room;
    localStorage.setItem('chat_saved_name', myName);
    localStorage.setItem('chat_saved_room', currentRoom);
    enterChat();
  };

  // Автовход
  window.addEventListener('DOMContentLoaded', async () => {
    const name = localStorage.getItem('chat_saved_name');
    const room = localStorage.getItem('chat_saved_room');
    if (name && room) {
      const { data, error } = await supabase.from('rooms').select('name').eq('name', room).single();
      if (!error && data) { myName = name; currentRoom = room; enterChat(); }
    }
  });

  function enterChat() {
    authScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');
    avatarEl.textContent = myName.charAt(0).toUpperCase();
    roomNameDisplay.textContent = '# ' + currentRoom;
    initChat();
  }

  async function initChat() {
    statusEl.textContent = 'Загрузка истории...';
    const { data: history, error } = await supabase.from('messages').select('*').eq('room', currentRoom).order('created_at', { ascending: true }).limit(100);
    if (error) { statusEl.textContent = 'История: ' + error.message; }
    else if (history) {
      history.forEach(m => { if (!renderedIds.has(m.id)) { renderedIds.add(m.id); addMessage(m); } });
    }

    channel = supabase.channel('room-' + currentRoom)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + currentRoom }, (payload) => {
        const m = payload.new;
        if (renderedIds.has(m.id)) return;
        renderedIds.add(m.id); addMessage(m);
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') { statusEl.textContent = 'Вы: ' + myName; inputEl.disabled = false; sendBtn.disabled = false; inputEl.focus(); }
      });

    sendBtn.onclick = sendMessage;
    inputEl.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };
    attachBtn.onclick = () => fileInput.click();
    fileInput.onchange = handleFileUpload;
    settingsBtn.onclick = openSettings;
    settingsBack.onclick = closeSettings;
    document.getElementById('logout-btn').onclick = () => {
      localStorage.removeItem('chat_saved_name');
      localStorage.removeItem('chat_saved_room');
      location.reload();
    };
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isSending) return;
    isSending = true; sendBtn.disabled = true; inputEl.value = '';
    const { error } = await supabase.from('messages').insert({ user_name: myName, text, image_url: null, room: currentRoom });
    if (error) { statusEl.textContent = 'Отправка: ' + error.message; inputEl.value = text; }
    isSending = false; sendBtn.disabled = false; inputEl.focus();
  }

  async function handleFileUpload() {
    const file = fileInput.files[0]; fileInput.value = '';
    if (!file || isSending) return;
    if (!file.type.startsWith('image/')) { statusEl.textContent = 'Фото: это не изображение'; return; }
    if (file.size > 5 * 1024 * 1024) { statusEl.textContent = 'Фото: файл больше 5 МБ'; return; }
    isSending = true; sendBtn.disabled = true; attachBtn.disabled = true;
    statusEl.textContent = 'Фото: загрузка...';
    const ext = file.name.split('.').pop() || 'jpg';
    const path = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    const { error: uploadError } = await supabase.storage.from('chat-images').upload(path, file, { contentType: file.type || 'image/jpeg', upsert: false });
    if (uploadError) { statusEl.textContent = 'Фото: ' + uploadError.message; return; }
    const { data: urlData } = supabase.storage.from('chat-images').getPublicUrl(path);
    const { error: insertError } = await supabase.from('messages').insert({ user_name: myName, text: '', image_url: urlData.publicUrl, room: currentRoom });
    if (insertError) statusEl.textContent = 'Фото: ' + insertError.message;
    else statusEl.textContent = 'Вы: ' + myName;
    isSending = false; sendBtn.disabled = false; attachBtn.disabled = false; inputEl.focus();
  }

  function addMessage(m) {
    const isSelf = m.user_name === myName;
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + (isSelf ? 'self' : 'other');
    wrap.id = 'msg-' + m.id;
    const div = document.createElement('div');
    div.className = 'msg ' + (isSelf ? 'self' : 'other');
    const time = m.created_at ? new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    const nameHtml = !isSelf ? '<div class="name">' + escapeHtml(m.user_name) + '</div>' : '';
    const textHtml = m.text ? escapeHtml(m.text) : '';
    const imgHtml = m.image_url ? '<img src="' + escapeHtml(m.image_url) + '" alt="фото">' : '';
    div.innerHTML = nameHtml + textHtml + imgHtml + '<span class="time">' + time + '</span>';
    wrap.appendChild(div);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
  }

  function openSettings() {
    chatScreen.classList.add('hidden');
    settingsScreen.classList.remove('hidden');
    document.getElementById('profile-name').textContent = myName;
    document.getElementById('profile-room').textContent = '# ' + currentRoom;
  }
  function closeSettings() {
    settingsScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');
  }
</script>
</body>
</html>
