<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Урал</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a1a; }
  #app { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: #fff; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.08); }
  @media (min-width: 481px) { #app { top: 20px; bottom: 20px; border-radius: 20px; } }

  #auth-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 40px 30px; overflow-y: auto; }
  #auth-screen > * { flex-shrink: 0; }

  #auth-screen .logo {
    width: 88px; height: 88px; border-radius: 50%;
    background: #2aabee;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(42,171,238,0.3);
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  #auth-screen .logo svg { display: block; }

  #auth-screen h2 { font-weight: 700; font-size: 24px; color: #1a1a1a; text-align: center; }
  #auth-screen .subtitle { font-size: 13px; color: #65676b; margin-top: -10px; text-align: center; }

  .auth-tabs { display: flex; gap: 6px; background: #f0f2f5; padding: 4px; border-radius: 24px; }
  .auth-tab { padding: 10px 24px; border: none; border-radius: 20px; background: transparent; color: #65676b; font-size: 14px; cursor: pointer; font-weight: 600; transition: 0.2s; }
  .auth-tab.active { background: #2aabee; color: white; box-shadow: 0 4px 12px rgba(42,171,238,0.3); }

  .auth-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
  .auth-form.hidden { display: none; }
  .auth-form input {
    width: 100%; padding: 14px 20px;
    border: 1px solid #e4e6eb; border-radius: 28px;
    background: #f5f6f8; color: #1a1a1a; font-size: 15px;
    outline: none; text-align: center; transition: 0.2s;
  }
  .auth-form input:focus { border-color: #2aabee; background: #fff; box-shadow: 0 0 0 4px rgba(42,171,238,0.12); }
  .auth-form input::placeholder { color: #b0b3b8; }
  .auth-form button {
    padding: 14px; border: none; border-radius: 28px;
    background: #2aabee; color: white;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: 0.2s; box-shadow: 0 4px 16px rgba(42,171,238,0.3);
  }
  .auth-form button:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .auth-form button:active { transform: scale(0.97); }

  #auth-error { color: #e74c3c; font-size: 13px; min-height: 20px; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <div id="auth-screen">
    <div class="logo">
      <svg viewBox="0 0 100 100" width="56" height="56" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 70 L30 35 L45 55 L60 25 L90 70 Z" fill="#ffffff" opacity="0.95"/>
        <path d="M10 70 L30 35 L45 55 L60 25 L90 70 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
        <path d="M60 25 L70 40 L65 42 L60 35 L55 42 L50 40 Z" fill="#e8f4ff" opacity="0.9"/>
        <text x="50" y="88" font-family="sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">У</text>
      </svg>
    </div>
    <h2>Урал</h2>
    <div class="subtitle">Общайся с миром</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">Войти</button>
      <button class="auth-tab" id="tab-create">Создать</button>
    </div>
    <div class="auth-form" id="form-login">
      <input type="text" id="login-name" placeholder="Ваше имя" maxlength="20">
      <input type="text" id="login-room" placeholder="Имя комнаты" maxlength="20">
      <input type="password" id="login-password" placeholder="Пароль комнаты" maxlength="30">
      <button id="login-btn">Войти в чат</button>
    </div>
    <div class="auth-form hidden" id="form-create">
      <input type="text" id="create-name" placeholder="Ваше имя" maxlength="20">
      <input type="text" id="create-room" placeholder="Название комнаты" maxlength="20">
      <input type="password" id="create-password" placeholder="Придумайте пароль" maxlength="30">
      <button id="create-btn">Создать комнату</button>
    </div>
    <div id="auth-error"></div>
  </div>
</div>
<script type="module">
  const SUPABASE_URL = 'https://ekqnbtjjqatvwsxlzenr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_AK4tP549G2IjTkSOeNvC4g_Z2ViaGc_';
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const tabLogin = document.getElementById('tab-login');
  const tabCreate = document.getElementById('tab-create');
  const formLogin = document.getElementById('form-login');
  const formCreate = document.getElementById('form-create');
  const authError = document.getElementById('auth-error');

  if (localStorage.getItem('chat_saved_name') && localStorage.getItem('chat_saved_room')) {
    window.location.href = 'chat.html';
  }

  tabLogin.onclick = () => { tabLogin.classList.add('active'); tabCreate.classList.remove('active'); formLogin.classList.remove('hidden'); formCreate.classList.add('hidden'); authError.textContent = ''; };
  tabCreate.onclick = () => { tabCreate.classList.add('active'); tabLogin.classList.remove('active'); formCreate.classList.remove('hidden'); formLogin.classList.add('hidden'); authError.textContent = ''; };

  document.getElementById('create-btn').onclick = async () => {
    const name = document.getElementById('create-name').value.trim();
    const room = document.getElementById('create-room').value.trim().toLowerCase().replace(/\s+/g, '-');
    const pass = document.getElementById('create-password').value.trim();
    if (!name || !room || !pass) { authError.textContent = 'Заполните все поля'; return; }
    const { error } = await supabase.from('rooms').insert({ name: room, password: pass });
    if (error) { authError.textContent = error.code === '23505' ? 'Комната уже есть' : 'Ошибка: ' + error.message; return; }
    localStorage.setItem('chat_saved_name', name);
    localStorage.setItem('chat_saved_room', room);
    window.location.href = 'chat.html';
  };

  document.getElementById('login-btn').onclick = async () => {
    const name = document.getElementById('login-name').value.trim();
    const room = document.getElementById('login-room').value.trim().toLowerCase().replace(/\s+/g, '-');
    const pass = document.getElementById('login-password').value.trim();
    if (!name || !room || !pass) { authError.textContent = 'Заполните все поля'; return; }
    const { data, error } = await supabase.from('rooms').select('password').eq('name', room).single();
    if (error || !data) { authError.textContent = 'Комната не найдена'; return; }
    if (data.password !== pass) { authError.textContent = 'Неверный пароль'; return; }
    localStorage.setItem('chat_saved_name', name);
    localStorage.setItem('chat_saved_room', room);
    window.location.href = 'chat.html';
  };
</script>
</body>
</html>
