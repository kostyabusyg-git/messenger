<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Чат класса</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0e1621; color: #f5f5f5; }
  #app { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: #17212b; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
  @media (min-width: 481px) { #app { top: 20px; bottom: 20px; border-radius: 16px; } }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: #17212b; transition: opacity 0.25s, transform 0.25s; }
  .screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.98); }
  #auth-screen { align-items: center; justify-content: center; gap: 18px; padding: 30px; overflow-y: auto; }
  #auth-screen .logo { width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(135deg, var(--accent, #2aabee), #229ed9); display: flex; align-items: center; justify-content: center; font-size: 40px; animation: float 3s ease-in-out infinite; box-shadow: 0 8px 32px rgba(42,171,238,0.3); }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  #auth-screen h2 { font-weight: 600; font-size: 22px; }
  #auth-screen input { width: 100%; max-width: 300px; padding: 14px 20px; border: 1px solid #2b3a4a; border-radius: 28px; background: #242f3d; color: #f5f5f5; font-size: 15px; outline: none; text-align: center; transition: 0.2s; }
  #auth-screen input:focus { border-color: var(--accent, #2aabee); box-shadow: 0 0 0 4px rgba(42,171,238,0.12); }
  .auth-tabs { display: flex; gap: 8px; background: #1c2733; padding: 4px; border-radius: 24px; }
  .auth-tab { padding: 10px 24px; border: none; border-radius: 20px; background: transparent; color: #7d8b99; font-size: 14px; cursor: pointer; transition: 0.2s; font-weight: 500; }
  .auth-tab.active { background: var(--accent, #2aabee); color: white; box-shadow: 0 4px 12px rgba(42,171,238,0.3); }
  .auth-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
  .auth-form.hidden { display: none; }
  .auth-form button { padding: 14px 40px; border: none; border-radius: 28px; background: var(--accent, #2aabee); color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 16px rgba(42,171,238,0.3); }
  .auth-form button:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .auth-form button:active { transform: scale(0.97); }
  #auth-error { color: #e74c3c; font-size: 13px; min-height: 20px; text-align: center; }
  #chat-screen { display: flex; flex-direction: column; }
  #header { padding: 14px 18px; background: #1c2733; border-bottom: 1px solid #101921; display: flex; align-items: center; gap: 12px; flex-shrink: 0; z-index: 2; }
  #header .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--accent, #2aabee), #229ed9); display: flex; align-items: center; justify-content: center; font-size: 19px; color: white; font-weight: 600; flex-shrink: 0; cursor: pointer; transition: transform 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  #header .avatar:hover { transform: scale(1.06); }
  #header .info { flex: 1; min-width: 0; }
  #header .info .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #header .info .status { font-size: 12px; color: #7d8b99; word-break: break-word; }
  #header .icon-btn { background: none; border: none; color: #7d8b99; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 10px; transition: 0.2s; flex-shrink: 0; }
  #header .icon-btn:hover { background: #242f3d; color: #fff; }
  #online-list { display: flex; gap: 6px; padding: 0 18px 10px; flex-wrap: wrap; align-items: center; }
  .online-badge { display: flex; align-items: center; gap: 4px; font-size: 11px; background: #242f3d; color: #a0b0c0; padding: 3px 10px 3px 3px; border-radius: 14px; }
  .online-badge .dot-avatar { width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, var(--accent, #2aabee), #229ed9); display: flex; align-items: center; justify-content: center; font-size: 9px; color: white; font-weight: 600; }
  #messages { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: var(--chat-bg, #0e1621); background-size: cover; background-position: center; transition: background 0.3s; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 4px; }
  .msg-wrap { display: flex; flex-direction: column; flex-shrink: 0; animation: msgIn 0.3s cubic-bezier(0.21, 1.02, 0.73, 1); }
  .msg-wrap.self { align-self: flex-end; align-items: flex-end; }
  .msg-wrap.other { align-self: flex-start; align-items: flex-start; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; word-break: break-word; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .msg.self { background: var(--accent, #2b5278); color: #fff; border-bottom-right-radius: 6px; }
  .msg.other { background: #182533; color: #e1e1e1; border-bottom-left-radius: 6px; }
  .msg .name { font-size: 11px; font-weight: 600; color: #6ab3f3; margin-bottom: 3px; }
  .msg .time { font-size: 10px; color: #7d8b99; float: right; margin-left: 8px; margin-top: 4px; }
  .msg img { max-width: 100%; height: auto; border-radius: 10px; margin-top: 6px; display: block; cursor: pointer; }
  .msg audio { width: 100%; margin-top: 6px; border-radius: 8px; }
  .msg .reply-quote { background: rgba(0,0,0,0.2); border-left: 3px solid var(--accent, #2aabee); padding: 5px 10px; margin-bottom: 5px; border-radius: 6px; font-size: 12px; opacity: 0.85; }
  .msg .actions { display: flex; gap: 2px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  .msg .actions button { background: none; border: none; color: #7d8b99; font-size: 14px; cursor: pointer; padding: 3px 5px; border-radius: 6px; transition: 0.2s; }
  .msg .actions button:hover { background: #2b3a4a; }
  .reactions { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .reaction-badge { font-size: 11px; background: #242f3d; color: #e1e1e1; padding: 3px 10px; border-radius: 12px; cursor: pointer; transition: 0.2s; }
  .reaction-badge:hover { background: #2b3a4a; }
  .reaction-badge.mine { background: var(--accent, #2aabee); color: white; }
  #input-area { padding: 10px 14px; background: #1c2733; border-top: 1px solid #101921; display: flex; gap: 6px; align-items: center; flex-shrink: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); z-index: 2; }
  #attach, #voice-btn { width: 38px; height: 38px; border: none; border-radius: 50%; background: #242f3d; color: #a0b0c0; font-size: 17px; cursor: pointer; flex-shrink: 0; transition: 0.2s; }
  #attach:hover, #voice-btn:hover { background: #2b3a4a; }
  #attach:active, #voice-btn:active { transform: scale(0.92); }
  #attach:disabled, #voice-btn:disabled { opacity: 0.5; }
  #voice-btn.recording { background: #e74c3c; color: white; animation: pulse-rec 1s infinite; }
  @keyframes pulse-rec { 0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.5); } 50% { box-shadow: 0 0 0 8px rgba(231,76,60,0); } }
  #input { flex: 1; padding: 11px 16px; border: none; border-radius: 22px; background: #242f3d; color: #f5f5f5; font-size: 14px; outline: none; transition: 0.2s; min-width: 0; }
  #input:focus { background: #2b3a4a; }
  #input::placeholder { color: #6c7883; }
  #send { width: 42px; height: 42px; border: none; border-radius: 50%; background: var(--accent, #2aabee); color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; box-shadow: 0 4px 12px rgba(42,171,238,0.3); }
  #send:hover { filter: brightness(1.1); transform: translateY(-1px); }
  #send:active { transform: scale(0.92); }
  #send:disabled { background: #3a4a5a; box-shadow: none; }
  #reply-bar { display: none; padding: 8px 14px; background: #1c2733; border-top: 1px solid #101921; font-size: 12px; color: #7d8b99; align-items: center; gap: 8px; }
  #reply-bar.active { display: flex; }
  #reply-bar .text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #reply-bar button { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 16px; }
  #recording-bar { display: none; padding: 8px 14px; background: #3a1a1a; border-top: 1px solid #5a2a2a; font-size: 12px; color: #e74c3c; align-items: center; gap: 8px; }
  #recording-bar.active { display: flex; }
  #recording-bar .dot { width: 10px; height: 10px; border-radius: 50%; background: #e74c3c; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  #settings-screen { background: #17212b; }
  #settings-header { padding: 16px 18px; background: #1c2733; border-bottom: 1px solid #101921; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #settings-header h2 { font-size: 18px; font-weight: 600; flex: 1; }
  #settings-header button { background: none; border: none; color: #7d8b99; font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: 0.2s; }
  #settings-header button:hover { background: #242f3d; color: #fff; }
  #settings-tabs { display: flex; padding: 0 18px; background: #1c2733; border-bottom: 1px solid #101921; flex-shrink: 0; overflow-x: auto; }
  .settings-tab { padding: 12px 16px; border: none; background: none; color: #7d8b99; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; white-space: nowrap; }
  .settings-tab.active { color: var(--accent, #2aabee); border-bottom-color: var(--accent, #2aabee); }
  #settings-content { flex: 1; overflow-y: auto; padding: 20px; }
  .settings-page { display: none; flex-direction: column; gap: 20px; }
  .settings-page.active { display: flex; animation: fadeIn 0.25s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .settings-section { background: #1c2733; border-radius: 14px; padding: 16px; }
  .settings-section h3 { font-size: 13px; color: #7d8b99; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; font-weight: 600; }
  .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #242f3d; }
  .setting-item:last-child { border-bottom: none; }
  .setting-item label { font-size: 14px; }
  .toggle { width: 48px; height: 28px; border-radius: 14px; background: #3a4a5a; border: none; cursor: pointer; position: relative; transition: 0.2s; flex-shrink: 0; }
  .toggle.on { background: var(--accent, #2aabee); }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: 0.2s; }
  .toggle.on::after { transform: translateX(20px); }
  .color-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .color-grid button { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: 0.2s; }
  .color-grid button:hover { transform: scale(1.1); }
  .color-grid button.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent, #2aabee); }
  .bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .bg-grid button { height: 60px; border-radius: 10px; border: 3px solid transparent; cursor: pointer; transition: 0.2s; }
  .bg-grid button:hover { transform: scale(1.03); }
  .bg-grid button.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent, #2aabee); }
  .btn-danger { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #3a2a2a; color: #e74c3c; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; }
  .btn-danger:hover { background: #4a2a2a; }
  .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #242f3d; font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .value { color: #7d8b99; }
</style>
</head>
<body>

<div id="app">
  <div id="auth-screen" class="screen">
    <div class="logo">💬</div>
    <h2>Чат класса</h2>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">Войти</button>
      <button class="auth-tab" id="tab-create">Создать</button>
    </div>
    <div class="auth-form" id="form-login">
      <input type="text" id="login-name" placeholder="Ваше имя" maxlength="20">
      <input type="text" id="login-room" placeholder="Имя комнаты" maxlength="20">
      <input type="password" id="login-password" placeholder="Пароль комнаты" maxlength="30">
      <button id="login-btn">Войти в чат</button>
    </div>
    <div class="auth-form hidden" id="form-create">
      <input type="text" id="create-name" placeholder="Ваше имя" maxlength="20">
      <input type="text" id="create-room" placeholder="Название комнаты" maxlength="20">
      <input type="password" id="create-password" placeholder="Придумайте пароль" maxlength="30">
      <button id="create-btn">Создать комнату</button>
    </div>
    <div id="auth-error"></div>
  </div>

  <div id="chat-screen" class="screen hidden">
    <div id="header">
      <div class="avatar" id="user-avatar">?</div>
      <div class="info">
        <div class="name" id="room-name-display">Комната</div>
        <div class="status" id="status">Подключение...</div>
      </div>
      <button class="icon-btn" id="settings-btn">⚙️</button>
    </div>
    <div id="online-list"></div>
    <div id="messages"></div>
    <div id="reply-bar">
      <span class="text" id="reply-text"></span>
      <button id="cancel-reply">✕</button>
    </div>
    <div id="recording-bar">
      <span class="dot"></span>
      <span id="recording-time">0:00</span>
      <span style="flex:1"></span>
      <button id="cancel-recording" style="color:#e74c3c;background:none;border:none;font-size:18px;cursor:pointer;">✕</button>
    </div>
    <div id="input-area">
      <button id="attach" title="Фото">📎</button>
      <input type="file" id="file-input" accept="image/*" hidden>
      <input type="text" id="input" placeholder="Написать сообщение..." disabled>
      <button id="voice-btn" title="Голосовое" disabled>🎤</button>
      <button id="send" disabled>➤</button>
    </div>
  </div>

  <div id="settings-screen" class="screen hidden">
    <div id="settings-header">
      <button id="settings-back">←</button>
      <h2>Настройки</h2>
    </div>
    <div id="settings-tabs">
      <button class="settings-tab active" data-tab="profile">Профиль</button>
      <button class="settings-tab" data-tab="appearance">Внешний вид</button>
      <button class="settings-tab" data-tab="notifications">Уведомления</button>
      <button class="settings-tab" data-tab="about">О комнате</button>
    </div>
    <div id="settings-content">
      <div class="settings-page active" data-page="profile">
        <div class="settings-section">
          <h3>Профиль</h3>
          <div class="info-row"><span>Имя</span><span class="value" id="profile-name">—</span></div>
          <div class="info-row"><span>Комната</span><span class="value" id="profile-room">—</span></div>
        </div>
        <div class="settings-section">
          <h3>Действия</h3>
          <button class="btn-danger" id="logout-btn">🚪 Выйти из комнаты</button>
        </div>
      </div>
      <div class="settings-page" data-page="appearance">
        <div class="settings-section">
          <h3>Цвет акцента</h3>
          <div class="color-grid" id="color-grid">
            <button style="background:#2aabee" data-color="#2aabee"></button>
            <button style="background:#e74c3c" data-color="#e74c3c"></button>
            <button style="background:#2ecc71" data-color="#2ecc71"></button>
            <button style="background:#9b59b6" data-color="#9b59b6"></button>
            <button style="background:#f39c12" data-color="#f39c12"></button>
            <button style="background:#1abc9c" data-color="#1abc9c"></button>
          </div>
        </div>
        <div class="settings-section">
          <h3>Фон чата</h3>
          <div class="bg-grid" id="bg-grid">
            <button style="background:#0e1621" data-bg="#0e1621"></button>
            <button style="background:#1a2332" data-bg="#1a2332"></button>
            <button style="background:#2b1a1a" data-bg="#2b1a1a"></button>
            <button style="background:#1a2b1a" data-bg="#1a2b1a"></button>
            <button style="background:linear-gradient(135deg,#1a2332,#2b1a3a)" data-bg="linear-gradient(135deg,#1a2332,#2b1a3a)"></button>
            <button style="background:linear-gradient(135deg,#0e1621,#1a2b2b)" data-bg="linear-gradient(135deg,#0e1621,#1a2b2b)"></button>
          </div>
        </div>
      </div>
      <div class="settings-page" data-page="notifications">
        <div class="settings-section">
          <h3>Звуки</h3>
          <div class="setting-item">
            <label>Звук новых сообщений</label>
            <button class="toggle" id="toggle-sound"></button>
          </div>
        </div>
      </div>
      <div class="settings-page" data-page="about">
        <div class="settings-section">
          <h3>Информация</h3>
          <div class="info-row"><span>Комната</span><span class="value" id="about-room">—</span></div>
          <div class="info-row"><span>Онлайн</span><span class="value" id="about-online">—</span></div>
          <div class="info-row"><span>Версия</span><span class="value">2.0</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  const SUPABASE_URL = 'https://ekqnbtjjqatvwsxlzenr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_AK4tP549G2IjTkSOeNvC4g_Z2ViaGc_';

  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const authScreen = document.getElementById('auth-screen');
  const chatScreen = document.getElementById('chat-screen');
  const settingsScreen = document.getElementById('settings-screen');
  const tabLogin = document.getElementById('tab-login');
  const tabCreate = document.getElementById('tab-create');
  const formLogin = document.getElementById('form-login');
  const formCreate = document.getElementById('form-create');
  const authError = document.getElementById('auth-error');
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const avatarEl = document.getElementById('user-avatar');
  const settingsBtn = document.getElementById('settings-btn');
  const settingsBack = document.getElementById('settings-back');
  const attachBtn = document.getElementById('attach');
  const fileInput = document.getElementById('file-input');
  const roomNameDisplay = document.getElementById('room-name-display');
  const onlineList = document.getElementById('online-list');
  const replyBar = document.getElementById('reply-bar');
  const replyText = document.getElementById('reply-text');
  const cancelReply = document.getElementById('cancel-reply');
  const voiceBtn = document.getElementById('voice-btn');
  const recordingBar = document.getElementById('recording-bar');
  const recordingTime = document.getElementById('recording-time');
  const cancelRecording = document.getElementById('cancel-recording');

  let myName = '';
  let currentRoom = '';
  let channel = null;
  let presenceChannel = null;
  let isSending = false;
  let replyToId = null;
  let replyToText = '';
  let renderedIds = new Set();
  let messageReactions = {};
  let messageMap = {};
  let mediaRecorder = null;
  let audioChunks = [];
  let recordingStartTime = 0;
  let recordingInterval = null;
  let isRecording = false;
  let currentStream = null;

  const settings = {
    sound: localStorage.getItem('chat_sound') !== 'off',
    accent: localStorage.getItem('chat_accent') || '#2aabee',
    bg: localStorage.getItem('chat_bg') || '#0e1621'
  };
  document.documentElement.style.setProperty('--accent', settings.accent);
  document.documentElement.style.setProperty('--chat-bg', settings.bg);

  let audioCtx = null;
  function playPing() {
    if (!settings.sound) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } catch (e) {}
  }

  tabLogin.addEventListener('click', () => { tabLogin.classList.add('active'); tabCreate.classList.remove('active'); formLogin.classList.remove('hidden'); formCreate.classList.add('hidden'); authError.textContent = ''; });
  tabCreate.addEventListener('click', () => { tabCreate.classList.add('active'); tabLogin.classList.remove('active'); formCreate.classList.remove('hidden'); formLogin.classList.add('hidden'); authError.textContent = ''; });

  document.getElementById('create-btn').addEventListener('click', async () => {
    const name = document.getElementById('create-name').value.trim();
    const room = document.getElementById('create-room').value.trim().toLowerCase().replace(/\s+/g, '-');
    const pass = document.getElementById('create-password').value.trim();
    if (!name || !room || !pass) { authError.textContent = 'Заполните все поля'; return; }
    try {
      const { error } = await supabase.from('rooms').insert({ name: room, password: pass });
      if (error) { authError.textContent = error.code === '23505' ? 'Комната уже есть' : 'Ошибка: ' + error.message; return; }
      myName = name; currentRoom = room;
      localStorage.setItem('chat_saved_name', myName); localStorage.setItem('chat_saved_room', currentRoom);
      enterChat();
    } catch (e) { authError.textContent = 'Сеть: ' + e.message; }
  });

  document.getElementById('login-btn').addEventListener('click', async () => {
    const name = document.getElementById('login-name').value.trim();
    const room = document.getElementById('login-room').value.trim().toLowerCase().replace(/\s+/g, '-');
    const pass = document.getElementById('login-password').value.trim();
    if (!name || !room || !pass) { authError.textContent = 'Заполните все поля'; return; }
    try {
      const { data, error } = await supabase.from('rooms').select('password').eq('name', room).single();
      if (error || !data) { authError.textContent = 'Комната не найдена'; return; }
      if (data.password !== pass) { authError.textContent = 'Неверный пароль'; return; }
      myName = name; currentRoom = room;
      localStorage.setItem('chat_saved_name', myName); localStorage.setItem('chat_saved_room', currentRoom);
      enterChat();
    } catch (e) { authError.textContent = 'Сеть: ' + e.message; }
  });

  window.addEventListener('DOMContentLoaded', async () => {
    const name = localStorage.getItem('chat_saved_name');
    const room = localStorage.getItem('chat_saved_room');
    if (name && room) {
      try {
        const { data, error } = await supabase.from('rooms').select('name').eq('name', room).single();
        if (!error && data) { myName = name; currentRoom = room; enterChat(); }
      } catch (e) {}
    }
  });

  function enterChat() {
    authScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');
    avatarEl.textContent = myName.charAt(0).toUpperCase();
    roomNameDisplay.textContent = '# ' + currentRoom;
    initChat(); initPresence();
  }

  function initPresence() {
    if (presenceChannel) supabase.removeChannel(presenceChannel);
    presenceChannel = supabase.channel(`presence-${currentRoom}`, { config: { presence: { key: myName } } });
    presenceChannel.on('presence', { event: 'sync' }, () => {
      const state = presenceChannel.presenceState();
      const users = Object.values(state).flat().map(p => p.user_name);
      onlineList.innerHTML = users.map(u => `<span class="online-badge"><span class="dot-avatar">${escapeHtml(u.charAt(0).toUpperCase())}</span>${escapeHtml(u)}</span>`).join('');
      const aboutOnline = document.getElementById('about-online');
      if (aboutOnline) aboutOnline.textContent = users.length + ' чел.';
    }).subscribe(async (status) => {
      if (status === 'SUBSCRIBED') await presenceChannel.track({ user_name: myName, online_at: new Date().toISOString() });
    });
  }

  async function initChat() {
    statusEl.textContent = 'Загрузка истории...';
    try {
      const { data: history, error } = await supabase.from('messages').select('*').eq('room', currentRoom).order('created_at', { ascending: true }).limit(100);
      if (error) { statusEl.textContent = 'История: ' + error.message; }
      else if (history) {
        history.forEach(m => { if (!renderedIds.has(m.id)) { renderedIds.add(m.id); messageMap[m.id] = m; addMessage(m); } });
        await loadReactions();
      }
    } catch (e) { statusEl.textContent = 'Сеть: ' + e.message; }

    if (channel) supabase.removeChannel(channel);
    channel = supabase.channel(`room-${currentRoom}`)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room=eq.${currentRoom}` }, (payload) => {
        const m = payload.new;
        if (renderedIds.has(m.id)) return;
        renderedIds.add(m.id); messageMap[m.id] = m; addMessage(m);
        if (m.user_name !== myName) playPing();
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages', filter: `room=eq.${currentRoom}` }, (payload) => {
        const el = document.getElementById('msg-' + payload.old.id);
        if (el) { el.remove(); delete messageMap[payload.old.id]; }
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: `room=eq.${currentRoom}` }, (payload) => {
        const el = document.getElementById('msg-' + payload.new.id);
        if (el) { el.remove(); renderedIds.delete(payload.new.id); messageMap[payload.new.id] = payload.new; addMessage(payload.new); }
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') { statusEl.textContent = `Вы: ${myName}`; inputEl.disabled = false; sendBtn.disabled = false; voiceBtn.disabled = !navigator.mediaDevices; inputEl.focus(); }
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') statusEl.textContent = 'Переподключение...';
      });

    supabase.channel('reactions-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'reactions' }, () => loadReactions()).subscribe();

    if (!sendBtn.dataset.bound) {
      sendBtn.dataset.bound = '1';
      sendBtn.addEventListener('click', sendMessage);
      inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
      attachBtn.addEventListener('click', () => { if (!isSending) fileInput.click(); });
      fileInput.addEventListener('change', handleFileUpload);
      voiceBtn.addEventListener('click', toggleVoiceRecording);
      cancelRecording.addEventListener('click', cancelVoiceRecording);
      cancelReply.addEventListener('click', () => { replyToId = null; replyToText = ''; replyBar.classList.remove('active'); });
    }
  }

  async function loadReactions() {
    const { data, error } = await supabase.from('reactions').select('*');
    if (error) return;
    messageReactions = {};
    data.forEach(r => { if (!messageReactions[r.message_id]) messageReactions[r.message_id] = []; messageReactions[r.message_id].push(r); });
    document.querySelectorAll('.msg-wrap').forEach(wrap => {
      const msgId = wrap.id.replace('msg-', '');
      renderReactions(msgId, wrap.querySelector('.reactions'));
    });
  }

  function renderReactions(msgId, container) {
    if (!container) return;
    const reactions = messageReactions[msgId] || [];
    const counts = {};
    reactions.forEach(r => { if (!counts[r.emoji]) counts[r.emoji] = { count: 0, mine: false }; counts[r.emoji].count++; if (r.user_name === myName) counts[r.emoji].mine = true; });
    container.innerHTML = Object.entries(counts).map(([emoji, data]) => `<span class="reaction-badge ${data.mine ? 'mine' : ''}" data-emoji="${emoji}" data-msg="${msgId}">${emoji} ${data.count}</span>`).join('');
    container.querySelectorAll('.reaction-badge').forEach(btn => btn.addEventListener('click', () => toggleReaction(parseInt(btn.dataset.msg), btn.dataset.emoji)));
  }

  async function toggleReaction(msgId, emoji) {
    const existing = (messageReactions[msgId] || []).find(r => r.user_name === myName);
    if (existing) { if (existing.emoji === emoji) await supabase.from('reactions').delete().eq('id', existing.id); else await supabase.from('reactions').update({ emoji }).eq('id', existing.id); }
    else await supabase.from('reactions').insert({ message_id: msgId, user_name: myName, emoji });
    await loadReactions();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isSending) return;
    isSending = true; sendBtn.disabled = true; inputEl.value = '';
    try {
      const payload = { user_name: myName, text, image_url: null, room: currentRoom, reply_to: replyToId || null };
      const { error } = await supabase.from('messages').insert(payload);
      if (error) { statusEl.textContent = 'Отправка: ' + error.message; inputEl.value = text; }
      else { replyToId = null; replyToText = ''; replyBar.classList.remove('active'); }
    } catch (e) { statusEl.textContent = 'Сеть: ' + e.message; inputEl.value = text; }
    finally { isSending = false; sendBtn.disabled = false; inputEl.focus(); }
  }

  async function handleFileUpload() {
    const file = fileInput.files[0]; fileInput.value = '';
    if (!file || isSending) return;
    if (!file.type.startsWith('image/')) { statusEl.textContent = 'Фото: это не изображение'; return; }
    if (file.size > 5 * 1024 * 1024) { statusEl.textContent = 'Фото: файл больше 5 МБ'; return; }
    isSending = true; sendBtn.disabled = true; attachBtn.disabled = true;
    statusEl.textContent = 'Фото: загрузка...';
    try {
      const ext = file.name.split('.').pop() || 'jpg';
      const path = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error: uploadError } = await supabase.storage.from('chat-images').upload(path, file, { contentType: file.type || 'image/jpeg', upsert: false, cacheControl: '3600' });
      if (uploadError) { statusEl.textContent = 'Фото: ' + (uploadError.message || JSON.stringify(uploadError)); return; }
      const { data: urlData } = supabase.storage.from('chat-images').getPublicUrl(path);
      if (!urlData || !urlData.publicUrl) { statusEl.textContent = 'Фото: не удалось получить URL'; return; }
      const { error: insertError } = await supabase.from('messages').insert({ user_name: myName, text: '', image_url: urlData.publicUrl, room: currentRoom, reply_to: replyToId || null });
      if (insertError) statusEl.textContent = 'Фото: ' + (insertError.message || JSON.stringify(insertError));
      else { statusEl.textContent = `Вы: ${myName}`; replyToId = null; replyToText = ''; replyBar.classList.remove('active'); }
    } catch (e) { statusEl.textContent = 'Фото: ' + (e.message || String(e)); }
    finally { isSending = false; sendBtn.disabled = false; attachBtn.disabled = false; inputEl.focus(); }
  }

  async function toggleVoiceRecording() { if (!isRecording) await startVoiceRecording(); else await stopAndSendVoice(); }

  async function startVoiceRecording() {
    if (!navigator.mediaDevices) { statusEl.textContent = 'Голосовые не поддерживаются'; return; }
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'audio/webm' });
      audioChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start();
      isRecording = true;
      voiceBtn.classList.add('recording');
      voiceBtn.textContent = '➤';
      voiceBtn.title = 'Отправить голосовое';
      recordingStartTime = Date.now();
      recordingBar.classList.add('active');
      recordingInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - recordingStartTime) / 1000);
        recordingTime.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      }, 500);
    } catch (e) { statusEl.textContent = 'Микрофон: ' + e.message; }
  }

  async function stopAndSendVoice() {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    isRecording = false;
    recordingBar.classList.remove('active');
    if (recordingInterval) clearInterval(recordingInterval);
    const done = new Promise(resolve => { mediaRecorder.onstop = resolve; });
    mediaRecorder.stop();
    await done;
    if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    voiceBtn.classList.remove('recording');
    voiceBtn.textContent = '🎤';
    voiceBtn.title = 'Голосовое';
    if (audioChunks.length === 0) { statusEl.textContent = 'Голосовое: пустая запись'; return; }
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    const path = `voice_${Date.now()}_${Math.random().toString(36).slice(2, 8)}.webm`;
    statusEl.textContent = 'Голосовое: загрузка...';
    const { error: uploadError } = await supabase.storage.from('chat-images').upload(path, blob, { contentType: 'audio/webm', upsert: false });
    if (uploadError) { statusEl.textContent = 'Голосовое: ' + uploadError.message; return; }
    const { data: urlData } = supabase.storage.from('chat-images').getPublicUrl(path);
    const { error: insertError } = await supabase.from('messages').insert({ user_name: myName, text: '', image_url: null, audio_url: urlData.publicUrl, room: currentRoom, reply_to: replyToId || null });
    if (insertError) statusEl.textContent = 'Голосовое: ' + insertError.message;
    else { statusEl.textContent = `Вы: ${myName}`; replyToId = null; replyToText = ''; replyBar.classList.remove('active'); }
    audioChunks = [];
  }

  function cancelVoiceRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.onstop = null; mediaRecorder.stop(); }
    if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    isRecording = false;
    voiceBtn.classList.remove('recording');
    voiceBtn.textContent = '🎤';
    voiceBtn.title = 'Голосовое';
    recordingBar.classList.remove('active');
    if (recordingInterval) clearInterval(recordingInterval);
    audioChunks = [];
  }

  function addMessage(m) {
    const isSelf = m.user_name === myName;
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + (isSelf ? 'self' : 'other');
    wrap.id = 'msg-' + m.id;
    const div = document.createElement('div');
    div.className = 'msg ' + (isSelf ? 'self' : 'other');
    const time = m.created_at ? new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    const nameHtml = !isSelf ? `<div class="name">${escapeHtml(m.user_name)}</div>` : '';
    let replyHtml = '';
    if (m.reply_to && messageMap[m.reply_to]) {
      const r = messageMap[m.reply_to];
      replyHtml = `<div class="reply-quote">↩ ${escapeHtml(r.user_name)}: ${escapeHtml((r.text || (r.image_url ? '📷 Фото' : r.audio_url ? '🎤 Голосовое' : '')).slice(0, 50))}</div>`;
    }
    const textHtml = m.text ? escapeHtml(m.text) : '';
    const imgHtml = m.image_url ? `<img src="${escapeHtml(m.image_url)}" alt="фото" loading="lazy">` : '';
    const audioHtml = m.audio_url ? `<audio controls src="${escapeHtml(m.audio_url)}"></audio>` : '';
    div.innerHTML = `${nameHtml}${replyHtml}${textHtml}${imgHtml}${audioHtml}<span class="time">${time}</span>`;
    const actions = document.createElement('div');
    actions.className = 'actions';
    const reactBtn = document.createElement('button'); reactBtn.textContent = '😊'; reactBtn.title = 'Реакция';
    reactBtn.addEventListener('click', () => { const e = prompt('Эмодзи:'); if (e) toggleReaction(m.id, e); });
    actions.appendChild(reactBtn);
    const replyBtn = document.createElement('button'); replyBtn.textContent = '↩'; replyBtn.title = 'Ответить';
    replyBtn.addEventListener('click', () => {
      replyToId = m.id;
      replyToText = m.text || (m.image_url ? '📷 Фото' : m.audio_url ? '🎤 Голосовое' : '');
      replyText.textContent = `Ответ ${m.user_name}: ${replyToText.slice(0, 40)}`;
      replyBar.classList.add('active');
      inputEl.focus();
    });
    actions.appendChild(replyBtn);
    if (isSelf) {
      const editBtn = document.createElement('button'); editBtn.textContent = '✏️'; editBtn.title = 'Редактировать';
      editBtn.addEventListener('click', async () => { const newText = prompt('Новый текст:', m.text || ''); if (newText !== null) await supabase.from('messages').update({ text: newText }).eq('id', m.id); });
      actions.appendChild(editBtn);
      const delBtn = document.createElement('button'); delBtn.textContent = '🗑️'; delBtn.title = 'Удалить';
      delBtn.addEventListener('click', async () => { if (confirm('Удалить?')) await supabase.from('messages').delete().eq('id', m.id); });
      actions.appendChild(delBtn);
    }
    const reactionsDiv = document.createElement('div'); reactionsDiv.className = 'reactions';
    div.appendChild(actions); div.appendChild(reactionsDiv);
    wrap.appendChild(div); messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    renderReactions(m.id, reactionsDiv);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]);
  }

  settingsBtn.addEventListener('click', () => {
    chatScreen.classList.add('hidden');
    settingsScreen.classList.remove('hidden');
    document.getElementById('profile-name').textContent = myName;
    document.getElementById('profile-room').textContent = '# ' + currentRoom;
    document.getElementById('about-room').textContent = '# ' + currentRoom;
  });
  settingsBack.addEventListener('click', () => {
    settingsScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');
  });

  document.querySelectorAll('.settings-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.settings-page').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.querySelector(`.settings-page[data-page="${tab.dataset.tab}"]`).classList.add('active');
    });
  });

  document.querySelectorAll('#color-grid button').forEach(btn => {
    if (btn.dataset.color === settings.accent) btn.classList.add('active');
    btn.addEventListener('click', () => {
      settings.accent = btn.dataset.color;
      localStorage.setItem('chat_accent', settings.accent);
      document.documentElement.style.setProperty('--accent', settings.accent);
      document.querySelectorAll('#color-grid button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  document.querySelectorAll('#bg-grid button').forEach(btn => {
    if (btn.dataset.bg === settings.bg) btn.classList.add('active');
    btn.addEventListener('click', () => {
      settings.bg = btn.dataset.bg;
      localStorage.setItem('chat_bg', settings.bg);
      document.documentElement.style.setProperty('--chat-bg', settings.bg);
      document.querySelectorAll('#bg-grid button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  const toggleSound = document.getElementById('toggle-sound');
  if (settings.sound) toggleSound.classList.add('on');
  toggleSound.addEventListener('click', () => {
    settings.sound = !settings.sound;
    localStorage.setItem('chat_sound', settings.sound ? 'on' : 'off');
    toggleSound.classList.toggle('on', settings.sound);
    if (settings.sound) playPing();
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('chat_saved_name'); localStorage.removeItem('chat_saved_room'); location.reload();
  });
</script>
</body>
</html>
