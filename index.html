<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Приватный Мессенджер</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0e1621; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; height: 80vh; background: #17212b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .chat-header { padding: 15px 20px; background: #24303f; border-bottom: 1px solid #101921; font-weight: bold; font-size: 1.1rem; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .message.sent { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.received { background: #182533; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { padding: 15px; background: #17212b; display: flex; gap: 10px; border-top: 1px solid #101921; }
        .chat-input { flex: 1; padding: 12px; background: #24303f; border: none; border-radius: 8px; color: #fff; outline: none; font-size: 0.95rem; }
        .send-btn { background: #5288c1; color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .send-btn:hover { background: #4172a5; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">🔒 Наш защищенный чат</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message received" id="statusMessage">Подключение к серверу чата...</div>
        </div>
        <form class="chat-input-area" id="chatForm">
            <input type="text" id="messageInput" class="chat-input" placeholder="Напишите сообщение..." autocomplete="off" required>
            <button type="submit" class="send-btn">Отправить</button>
        </form>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        import { injectSpeedInsights } from 'https://esm.sh/@vercel/speed-insights@2.0.0';

        const SUPABASE_URL = "https://mhrylswcajeoamsogydc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_QNK3ulcLA257InnrWjTDGw_DSVXmrj2";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // Initialize Vercel Speed Insights
        injectSpeedInsights();

        const myUserId = 'user_' + Math.random().toString(36).substring(2, 11);

        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const chatMessages = document.getElementById('chatMessages');
        const statusMessage = document.getElementById('statusMessage');

        const loadedMessageIds = new Set();
        let isFetching = false;

        function renderMessage(id, text, senderId) {
            if (loadedMessageIds.has(id)) return;
            loadedMessageIds.add(id);

            if (statusMessage && statusMessage.parentNode) {
                statusMessage.style.display = 'none';
            }

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(senderId === myUserId ? 'sent' : 'received');
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function fetchMessages() {
            if (isFetching) return;
            isFetching = true;
            try {
                const { data: messages, error } = await supabase
                    .from('messages')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) throw error;

                if (messages && messages.length > 0) {
                    messages.forEach(msg => renderMessage(msg.id, msg.text, msg.user_id));
                } else if (statusMessage) {
                    statusMessage.textContent = "Сообщений пока нет. Будь первым!";
                }
            } catch (err) {
                if (statusMessage) statusMessage.textContent = "Ошибка сети. Чат обновится сам...";
                console.error("Ошибка загрузки:", err);
            } finally {
                isFetching = false;
            }
        }

        fetchMessages();
        setInterval(fetchMessages, 2000);

        chatForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text === '') return;

            try {
                const { error } = await supabase
                    .from('messages')
                    .insert([{ text: text, user_id: myUserId }]);

                if (error) throw error;
                messageInput.value = '';
                fetchMessages();
            } catch (err) {
                console.error("Ошибка отправки:", err);
                alert("Ошибка при отправке!");
            }
        });
    </script>
</body>
</html>
