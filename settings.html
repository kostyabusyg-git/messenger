<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Настройки — Урал</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2aabee">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0e1621; color: #f5f5f5; }
  #app { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: #17212b; display: flex; flex-direction: column; }
  @media (min-width: 481px) { #app { top: 20px; bottom: 20px; border-radius: 16px; } }
  #header { padding: 16px 18px; background: #1c2733; border-bottom: 1px solid #101921; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #header h2 { font-size: 18px; font-weight: 600; flex: 1; }
  #header button { background: none; border: none; color: #7d8b99; font-size: 22px; cursor: pointer; padding: 4px 8px; }
  #tabs { display: flex; padding: 0 18px; background: #1c2733; border-bottom: 1px solid #101921; flex-shrink: 0; overflow-x: auto; }
  .tab { padding: 12px 16px; border: none; background: none; color: #7d8b99; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.active { color: #2aabee; border-bottom-color: #2aabee; }
  #content { flex: 1; overflow-y: auto; padding: 20px; }
  .page { display: none; flex-direction: column; gap: 20px; }
  .page.active { display: flex; animation: fadeIn 0.25s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .section { background: #1c2733; border-radius: 14px; padding: 16px; }
  .section h3 { font-size: 13px; color: #7d8b99; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; font-weight: 600; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #242f3d; }
  .item:last-child { border-bottom: none; }
  .item label { font-size: 14px; }
  .toggle { width: 48px; height: 28px; border-radius: 14px; background: #3a4a5a; border: none; cursor: pointer; position: relative; transition: 0.2s; flex-shrink: 0; }
  .toggle.on { background: #2aabee; }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: 0.2s; }
  .toggle.on::after { transform: translateX(20px); }
  .color-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .color-grid button { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .color-grid button.active { border-color: #fff; box-shadow: 0 0 0 2px #2aabee; }
  .bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .bg-grid button { height: 60px; border-radius: 10px; border: 3px solid transparent; cursor: pointer; }
  .bg-grid button.active { border-color: #fff; box-shadow: 0 0 0 2px #2aabee; }
  .font-grid, .radius-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .font-grid button, .radius-grid button { padding: 8px 16px; border: 2px solid transparent; border-radius: 10px; background: #242f3d; color: #a0b0c0; font-size: 13px; cursor: pointer; }
  .font-grid button.active, .radius-grid button.active { border-color: #2aabee; color: #fff; }
  .btn-danger { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #3a2a2a; color: #e74c3c; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #2aabee; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
  .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #242f3d; font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .value { color: #7d8b99; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <button id="back-btn">←</button>
    <h2>Настройки</h2>
  </div>
  <div id="tabs">
    <button class="tab active" data-tab="profile">Профиль</button>
    <button class="tab" data-tab="appearance">Внешний вид</button>
    <button class="tab" data-tab="notifications">Уведомления</button>
    <button class="tab" data-tab="about">О приложении</button>
  </div>
  <div id="content">
    <div class="page active" data-page="profile">
      <div class="section">
        <h3>Профиль</h3>
        <div class="info-row"><span>Имя</span><span class="value" id="profile-name">—</span></div>
        <div class="info-row"><span>Комната</span><span class="value" id="profile-room">—</span></div>
      </div>
      <div class="section">
        <h3>Действия</h3>
        <button class="btn-primary" id="change-room-btn">🔄 Сменить комнату</button>
        <button class="btn-danger" id="logout-btn" style="margin-top:10px;">🚪 Выйти полностью</button>
      </div>
    </div>

    <div class="page" data-page="appearance">
      <div class="section">
        <h3>Цвет акцента</h3>
        <div class="color-grid" id="color-grid">
          <button style="background:#2aabee" data-color="#2aabee"></button>
          <button style="background:#e74c3c" data-color="#e74c3c"></button>
          <button style="background:#2ecc71" data-color="#2ecc71"></button>
          <button style="background:#9b59b6" data-color="#9b59b6"></button>
          <button style="background:#f39c12" data-color="#f39c12"></button>
          <button style="background:#1abc9c" data-color="#1abc9c"></button>
        </div>
      </div>
      <div class="section">
        <h3>Фон чата</h3>
        <div class="bg-grid" id="bg-grid">
          <button style="background:#0e1621" data-bg="#0e1621"></button>
          <button style="background:#1a2332" data-bg="#1a2332"></button>
          <button style="background:#2b1a1a" data-bg="#2b1a1a"></button>
          <button style="background:#1a2b1a" data-bg="#1a2b1a"></button>
          <button style="background:linear-gradient(135deg,#1a2332,#2b1a3a)" data-bg="linear-gradient(135deg,#1a2332,#2b1a3a)"></button>
          <button style="background:linear-gradient(135deg,#0e1621,#1a2b2b)" data-bg="linear-gradient(135deg,#0e1621,#1a2b2b)"></button>
        </div>
      </div>
      <div class="section">
        <h3>Размер шрифта</h3>
        <div class="font-grid" id="font-grid">
          <button data-font="13">Маленький</button>
          <button data-font="14">Средний</button>
          <button data-font="16">Большой</button>
        </div>
      </div>
      <div class="section">
        <h3>Скругление сообщений</h3>
        <div class="radius-grid" id="radius-grid">
          <button data-radius="4">Квадратные</button>
          <button data-radius="16">Скруглённые</button>
          <button data-radius="24">Круглые</button>
        </div>
      </div>
    </div>

    <div class="page" data-page="notifications">
      <div class="section">
        <h3>Звуки</h3>
        <div class="item">
          <label>Звук новых сообщений</label>
          <button class="toggle" id="toggle-sound"></button>
        </div>
      </div>
      <div class="section">
        <h3>Время</h3>
        <div class="item">
          <label>Показывать время у сообщений</label>
          <button class="toggle" id="toggle-time"></button>
        </div>
      </div>
    </div>

    <div class="page" data-page="about">
      <div class="section">
        <h3>Информация</h3>
        <div class="info-row"><span>Мессенджер</span><span class="value">Урал</span></div>
        <div class="info-row"><span>Версия</span><span class="value">3.0</span></div>
        <div class="info-row"><span>Технологии</span><span class="value">PWA + Supabase</span></div>
        <div class="info-row"><span>Сделано</span><span class="value">для класса</span></div>
      </div>
    </div>
  </div>
</div>

<script>
  const myName = localStorage.getItem('chat_saved_name');
  const currentRoom = localStorage.getItem('chat_saved_room');
  if (!myName || !currentRoom) { window.location.href = 'index.html'; }

  document.getElementById('profile-name').textContent = myName;
  document.getElementById('profile-room').textContent = currentRoom.startsWith('dm_') ? '@' + currentRoom.replace('dm_','') : '# ' + currentRoom;

  document.getElementById('back-btn').onclick = () => { window.location.href = 'chat.html'; };
  document.getElementById('change-room-btn').onclick = () => {
    localStorage.removeItem('chat_saved_room');
    window.location.href = 'index.html';
  };
  document.getElementById('logout-btn').onclick = () => {
    localStorage.removeItem('chat_saved_name');
    localStorage.removeItem('chat_saved_room');
    window.location.href = 'index.html';
  };

  // Вкладки
  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.querySelector(`.page[data-page="${tab.dataset.tab}"]`).classList.add('active');
    };
  });

  // Настройки
  const settings = {
    accent: localStorage.getItem('chat_accent') || '#2aabee',
    bg: localStorage.getItem('chat_bg') || '#0e1621',
    font: localStorage.getItem('chat_font') || '14',
    radius: localStorage.getItem('chat_radius') || '16',
    sound: localStorage.getItem('chat_sound') !== 'off',
    time: localStorage.getItem('chat_time') !== 'off'
  };

  // Цвет
  document.querySelectorAll('#color-grid button').forEach(btn => {
    if (btn.dataset.color === settings.accent) btn.classList.add('active');
    btn.onclick = () => {
      localStorage.setItem('chat_accent', btn.dataset.color);
      document.querySelectorAll('#color-grid button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
  });

  // Фон
  document.querySelectorAll('#bg-grid button').forEach(btn => {
    if (btn.dataset.bg === settings.bg) btn.classList.add('active');
    btn.onclick = () => {
      localStorage.setItem('chat_bg', btn.dataset.bg);
      document.querySelectorAll('#bg-grid button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
  });

  // Шрифт
  document.querySelectorAll('#font-grid button').forEach(btn => {
    if (btn.dataset.font === settings.font) btn.classList.add('active');
    btn.onclick = () => {
      localStorage.setItem('chat_font', btn.dataset.font);
      document.querySelectorAll('#font-grid button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
  });

  // Скругление
  document.querySelectorAll('#radius-grid button').forEach(btn => {
    if (btn.dataset.radius === settings.radius) btn.classList.add('active');
    btn.onclick = () => {
      localStorage.setItem('chat_radius', btn.dataset.radius);
      document.querySelectorAll('#radius-grid button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
  });

  // Звук
  const toggleSound = document.getElementById('toggle-sound');
  if (settings.sound) toggleSound.classList.add('on');
  toggleSound.onclick = () => {
    settings.sound = !settings.sound;
    localStorage.setItem('chat_sound', settings.sound ? 'on' : 'off');
    toggleSound.classList.toggle('on', settings.sound);
  };

  // Время
  const toggleTime = document.getElementById('toggle-time');
  if (settings.time) toggleTime.classList.add('on');
  toggleTime.onclick = () => {
    settings.time = !settings.time;
    localStorage.setItem('chat_time', settings.time ? 'on' : 'off');
    toggleTime.classList.toggle('on', settings.time);
  };
</script>
</body>
</html>
