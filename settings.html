<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Настройки — Урал</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2aabee">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0e1621; color: #f5f5f5; }
  #app { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: #17212b; display: flex; flex-direction: column; }
  @media (min-width: 481px) { #app { top: 20px; bottom: 20px; border-radius: 16px; } }
  #header { padding: 16px 18px; background: #1c2733; border-bottom: 1px solid #101921; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #header h2 { font-size: 18px; font-weight: 600; flex: 1; }
  #header button { background: none; border: none; color: #7d8b99; font-size: 22px; cursor: pointer; padding: 4px 8px; }
  #content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .settings-section { background: #1c2733; border-radius: 14px; padding: 16px; }
  .settings-section h3 { font-size: 13px; color: #7d8b99; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #242f3d; font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .value { color: #7d8b99; }
  .btn-danger { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #3a2a2a; color: #e74c3c; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <button id="back-btn">←</button>
    <h2>Настройки</h2>
  </div>
  <div id="content">
    <div class="settings-section">
      <h3>Профиль</h3>
      <div class="info-row"><span>Имя</span><span class="value" id="profile-name">—</span></div>
      <div class="info-row"><span>Комната</span><span class="value" id="profile-room">—</span></div>
    </div>
    <div class="settings-section">
      <h3>Действия</h3>
      <button class="btn-danger" id="logout-btn">🚪 Выйти из комнаты</button>
    </div>
  </div>
</div>
<script>
  const myName = localStorage.getItem('chat_saved_name');
  const currentRoom = localStorage.getItem('chat_saved_room');
  if (!myName || !currentRoom) { window.location.href = 'index.html'; }

  document.getElementById('profile-name').textContent = myName;
  document.getElementById('profile-room').textContent = '# ' + currentRoom;

  document.getElementById('back-btn').onclick = () => { window.location.href = 'chat.html'; };
  document.getElementById('logout-btn').onclick = () => {
    localStorage.removeItem('chat_saved_name');
    localStorage.removeItem('chat_saved_room');
    window.location.href = 'index.html';
  };
</script>
</body>
</html>
